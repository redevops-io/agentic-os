[project]
name = "agentic-os"
version = "0.2.4"
description = "The control plane for the redevops.io Agentic Business OS — run your business as a cost-aware fleet of agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later WITH Commons-Clause" }
dependencies = [
    # The Discovery -> Mission boundary, owned by neither runtime. Pinned to a
    # tag: a branch can be rebased under a consumer, and a contract that moves
    # silently is not a contract. Importing it is why this repository carries
    # the Commons Clause — see LICENSE.md.
    "runtime-contracts @ git+https://github.com/redevops-io/runtime-contracts.git@v0.3.4",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Durable event-store backends (the event log is also the audit log). Optional: the default
# store is zero-dependency in-memory/JSONL. See agentic_os.mission.event_backends.
duckdb = ["duckdb>=1.0"]         # embedded single-file ledger (standalone)
postgres = ["psycopg[binary]>=3.1"]   # shared ledger for member/hub topology
# The live Context-Runtime / RAG indexer for file & cloud sources (hybrid BM25 + embeddings
# over DuckDB). Optional: without it, file sources scan but content isn't indexed/retrievable.
# Pulls sentence-transformers. See agentic_os.sources_rag.
rag = ["redevops-rag @ git+https://github.com/redevops-io/redevops-rag.git@main"]
# Live provider adapters for the Integration Plane. Optional by design: the base install
# reasons about integrations (manifest, wizard, ConnectPlan) with no connector dependency;
# this pulls the runtime plugin that actually connects/executes against SaaS providers.
# See agentic_os.integrations.live.
connectors = ["redevops-connectors @ git+https://github.com/redevops-io/redevops-connectors.git@main"]
# The served Projects app (UI + API on one origin). fastapi/uvicorn are already base deps and
# the UI bundle ships in the wheel, so serving needs nothing extra; this pulls the connector
# plugin so the running app can actually connect apps and sources (live), not just render.
projects = ["redevops-connectors @ git+https://github.com/redevops-io/redevops-connectors.git@main"]

[project.scripts]
agentic-os = "agentic_os.cli:main"
# Bring up the Projects UI + API together: `pip install 'agentic-os[projects]'` then run this.
agentic-os-projects = "agentic_os.projects_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_os"]
# The vendored Projects UI bundle is data, not Python — force-include it so the wheel ships it
# regardless of VCS-ignore rules (so `pip install` serves the UI out of the box).
artifacts = ["agentic_os/projects_ui/**"]

[tool.hatch.metadata]
# `runtime-contracts` is pinned by git tag, which hatchling calls a direct
# reference and refuses by default. Without this, v0.2.0 built here and failed
# to install anywhere else — the tag was unusable, and only a consumer could
# find that out.
allow-direct-references = true
