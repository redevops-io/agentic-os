[project]
name = "agentic-os"
version = "0.2.2"
description = "The control plane for the redevops.io Agentic Business OS — run your business as a cost-aware fleet of agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later WITH Commons-Clause" }
dependencies = [
    # The Discovery -> Mission boundary, owned by neither runtime. Pinned to a
    # tag: a branch can be rebased under a consumer, and a contract that moves
    # silently is not a contract. Importing it is why this repository carries
    # the Commons Clause — see LICENSE.md.
    "runtime-contracts @ git+https://github.com/redevops-io/runtime-contracts.git@v0.2.2",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentic-os = "agentic_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_os"]

[tool.hatch.metadata]
# `runtime-contracts` is pinned by git tag, which hatchling calls a direct
# reference and refuses by default. Without this, v0.2.0 built here and failed
# to install anywhere else — the tag was unusable, and only a consumer could
# find that out.
allow-direct-references = true
