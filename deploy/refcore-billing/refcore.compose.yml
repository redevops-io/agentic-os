# A real, persistent billing core speaking the Lago customer contract — proves the World Adapter LIVE path.
# REFCORE_API_KEY is required (no default): export it, or put it in a host-only .env beside this file (never committed).
services:
  refcore-billing:
    build: .
    image: ${REFCORE_IMAGE:-refcore-billing:latest}
    container_name: refcore-billing
    restart: unless-stopped
    environment:
      - REFCORE_API_KEY=${REFCORE_API_KEY:?set REFCORE_API_KEY to a secret of your own choosing (no default key)}
      - REFCORE_DB=/data/customers.json
    volumes:
      - refcore-data:/data
    ports:
      - "${REFCORE_PORT:-8106}:8106"
    security_opt:
      - apparmor=docker-contextos
volumes:
  refcore-data:
