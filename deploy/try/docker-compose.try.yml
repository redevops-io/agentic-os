# Try ReDevOps in a sandbox — one command, cross-platform (Docker Desktop on Win/Mac, Docker on Linux).
#   cp deploy/try/.env.example deploy/try/.env   # then put your LLM setup in it
#   docker compose -f deploy/try/docker-compose.try.yml up
#   → open http://localhost:8787
services:
  redevops-projects:
    build:
      context: ../..                      # repo root
      dockerfile: deploy/try/Dockerfile
    image: redevops-projects-try
    ports:
      - "127.0.0.1:8787:8787"            # bound to localhost only — a local try, not a public server
    env_file:
      - .env                              # LLM_API_KEY / LLM_BASE_URL / LLM_MODEL (see .env.example)
    # Lets the container reach a model running on the HOST (Ollama/vLLM/LM Studio). Harmless on
    # Docker Desktop (already provided); required on Linux for host.docker.internal to resolve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
