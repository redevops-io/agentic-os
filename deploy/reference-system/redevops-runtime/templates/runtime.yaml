apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ .Values.runtime.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "rr.labels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
      annotations:
        # roll the pods when the governed config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "rr.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runtime
          {{- if and .Values.security.enabled .Values.security.image.repository }}
          # Enterprise runtime image — bundles runtime-plugins-enterprise so the security/telemetry planes
          # can be injected at boot (the public image cannot import the private package).
          image: "{{ .Values.security.image.repository }}:{{ .Values.security.image.tag }}"
          {{- else }}
          image: "{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.http.port }}
            {{- if .Values.runtime.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.runtime.grpc.port }}
            {{- end }}
          env:
            - name: RDO_PGVECTOR_DSN
              value: {{ include "rr.pgvectorDsn" . | quote }}
            {{- if .Values.model.apiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.model.apiKeySecret }}, key: OPENAI_API_KEY }
            {{- end }}
            {{- if .Values.security.enabled }}
            # v0.3.0 intrinsic-security plane (requires the enterprise image; see values.security). The
            # planes are injected in-process — the enterprise boot path reads these to wire
            # build_secured_executor(...) / the credential broker / the SIEM sink.
            - name: RDO_SECURITY_ENABLED
              value: "true"
            {{- if .Values.security.sandbox.enabled }}
            - name: RDO_SANDBOX_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.security.credentialBroker.enabled }}
            # authority-scoped credential brokerage. backend=local uses the open env/file dev providers;
            # backend=vault|openbao selects the enterprise production broker. A capability declaring
            # production_broker_required rejects assurance=development (fail-closed) — the secret never
            # enters a plan/context/fingerprint/telemetry/lakehouse; only a CredentialGrant reference does.
            - name: RDO_CREDENTIAL_BROKER
              value: {{ .Values.security.credentialBroker.backend | quote }}
            - name: RDO_CREDENTIAL_BROKER_ASSURANCE
              value: {{ .Values.security.credentialBroker.assurance | quote }}
            - name: RDO_CREDENTIAL_BROKER_FAIL_CLOSED
              value: {{ .Values.security.credentialBroker.failClosed | quote }}
            {{- if .Values.security.credentialBroker.vault.addr }}
            - name: VAULT_ADDR
              value: {{ .Values.security.credentialBroker.vault.addr | quote }}
            - name: VAULT_NAMESPACE
              value: {{ .Values.security.credentialBroker.vault.namespace | quote }}
            - name: RDO_VAULT_AUTH_METHOD
              value: {{ .Values.security.credentialBroker.vault.auth.method | quote }}
            - name: RDO_VAULT_ROLE
              value: {{ .Values.security.credentialBroker.vault.auth.role | quote }}
            {{- if .Values.security.credentialBroker.vault.transit.enabled }}
            - name: RDO_VAULT_TRANSIT_ENABLED
              value: "true"
            {{- end }}
            {{- if eq .Values.security.credentialBroker.vault.auth.method "approle" }}
            {{- if .Values.security.credentialBroker.vault.auth.approleSecret }}
            - name: VAULT_APPROLE_SECRET_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.security.credentialBroker.vault.auth.approleSecret }}, key: secret_id }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.security.siemEndpoint }}
            - name: RDO_SIEM_ENDPOINT
              value: {{ .Values.security.siemEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.telemetry.otel.enabled }}
            # Mission-native telemetry export — the TelemetryBridge's otel_sink points here.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.otel.serviceName | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          resources: {{ toYaml .Values.runtime.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/redevops
            {{- if .Values.runtime.mission.ledger.persistent }}
            - name: ledger
              mountPath: /var/lib/redevops/ledger
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "rr.fullname" . }}-config }
        {{- if .Values.runtime.mission.ledger.persistent }}
        - name: ledger
          persistentVolumeClaim: { claimName: {{ include "rr.fullname" . }}-ledger }
        {{- end }}
---
{{- if .Values.runtime.mission.ledger.persistent }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rr.fullname" . }}-ledger
  labels: {{- include "rr.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.runtime.mission.ledger.size }}
  {{- with .Values.runtime.mission.ledger.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: {{ .Values.runtime.http.port }}
      targetPort: http
    {{- if .Values.runtime.grpc.enabled }}
    - name: grpc
      port: {{ .Values.runtime.grpc.port }}
      targetPort: grpc
    {{- end }}
