apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ .Values.runtime.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        {{- include "rr.labels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
      annotations:
        # roll the pods when the governed config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "rr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.runtime.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runtime
          # An immutable reference (repo@sha256:...) or a fixed version tag; the render fails when neither is set (rr.imageRef).
          # With security.enabled and security.image.repository this is the enterprise image (bundles
          # runtime-plugins-enterprise; the public image cannot import the private package).
          image: {{ include "rr.runtimeImage" . | quote }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          securityContext: {{ toYaml .Values.runtime.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.http.port }}
            {{- if .Values.runtime.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.runtime.grpc.port }}
            {{- end }}
          env:
            # grant-store key from an external Secret; the chart refuses to render without one (no default, no literal)
            - name: PERMISSIONS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "permissions.keySecret is required: create the Secret first (agentic-os permissions key --env-file permissions.env --k8s-secret NAME) and set permissions.keySecret=NAME" .Values.permissions.keySecret | quote }}
                  key: PERMISSIONS_KEY
            - name: PERMISSIONS_DIR
              value: /var/lib/redevops/ledger/permissions
            # read-only root filesystem: everything the service writes goes to the emptyDir mounts below
            - name: HOME
              value: /tmp
            - name: AGENTIC_OS_HOME
              value: /data
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- if .Values.retriever.pgvector.bundled.enabled }}
            - name: RDO_PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ required "retriever.pgvector.bundled.passwordSecret is required when the bundled pgvector is enabled: create the Secret first (key POSTGRES_PASSWORD)" .Values.retriever.pgvector.bundled.passwordSecret | quote }}, key: POSTGRES_PASSWORD }
            {{- end }}
            {{- if and .Values.retriever.pgvector.dsnSecret (not .Values.retriever.pgvector.bundled.enabled) }}
            - name: RDO_PGVECTOR_DSN
              valueFrom:
                secretKeyRef: { name: {{ .Values.retriever.pgvector.dsnSecret | quote }}, key: RDO_PGVECTOR_DSN }
            {{- else }}
            - name: RDO_PGVECTOR_DSN
              value: {{ include "rr.pgvectorDsn" . | quote }}
            {{- end }}
            {{- if .Values.runtime.controlTokenSecret }}
            # Bearer token for the runtime's mutating routes (POST /missions, /approvals, /up, ...), from an existing Secret.
            # Without it those routes answer 503 (fail closed); /health and the probes below need no credential.
            - name: AGENTIC_OS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.runtime.controlTokenSecret | quote }}, key: AGENTIC_OS_CONTROL_TOKEN }
            {{- end }}
            {{- if .Values.model.apiKeySecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.model.apiKeySecret }}, key: OPENAI_API_KEY }
            {{- end }}
            {{- if .Values.security.enabled }}
            # v0.3.0 intrinsic-security plane (requires the enterprise image; see values.security). The
            # planes are injected in-process — the enterprise boot path reads these to wire
            # build_secured_executor(...) / the credential broker / the SIEM sink.
            - name: RDO_SECURITY_ENABLED
              value: "true"
            {{- if .Values.security.sandbox.enabled }}
            - name: RDO_SANDBOX_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.security.credentialBroker.enabled }}
            # authority-scoped credential brokerage. backend=local uses the open env/file dev providers;
            # backend=vault|openbao selects the enterprise production broker. A capability declaring
            # production_broker_required rejects assurance=development (fail-closed) — the secret never
            # enters a plan/context/fingerprint/telemetry/lakehouse; only a CredentialGrant reference does.
            - name: RDO_CREDENTIAL_BROKER
              value: {{ .Values.security.credentialBroker.backend | quote }}
            - name: RDO_CREDENTIAL_BROKER_ASSURANCE
              value: {{ .Values.security.credentialBroker.assurance | quote }}
            - name: RDO_CREDENTIAL_BROKER_FAIL_CLOSED
              value: {{ .Values.security.credentialBroker.failClosed | quote }}
            {{- if .Values.security.credentialBroker.vault.addr }}
            - name: VAULT_ADDR
              value: {{ .Values.security.credentialBroker.vault.addr | quote }}
            - name: VAULT_NAMESPACE
              value: {{ .Values.security.credentialBroker.vault.namespace | quote }}
            - name: RDO_VAULT_AUTH_METHOD
              value: {{ .Values.security.credentialBroker.vault.auth.method | quote }}
            - name: RDO_VAULT_ROLE
              value: {{ .Values.security.credentialBroker.vault.auth.role | quote }}
            {{- if .Values.security.credentialBroker.vault.transit.enabled }}
            - name: RDO_VAULT_TRANSIT_ENABLED
              value: "true"
            {{- end }}
            {{- if eq .Values.security.credentialBroker.vault.auth.method "approle" }}
            {{- if .Values.security.credentialBroker.vault.auth.approleSecret }}
            - name: VAULT_APPROLE_SECRET_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.security.credentialBroker.vault.auth.approleSecret }}, key: secret_id }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.security.siemEndpoint }}
            - name: RDO_SIEM_ENDPOINT
              value: {{ .Values.security.siemEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.telemetry.otel.enabled }}
            # Mission-native telemetry export — the TelemetryBridge's otel_sink points here.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.otel.serviceName | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.runtime.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.runtime.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            {{- toYaml .Values.runtime.probes.liveness | nindent 12 }}
          resources: {{ toYaml .Values.runtime.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/redevops
              readOnly: true
            # the writable paths of the read-only root filesystem (docs/release/OCI_RELEASE_RUNBOOK.md, "Writable paths")
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: aos-home
              mountPath: /app/.agentic-os
            # the ledger / permissions directory: the PVC when persistent, else a scratch volume (read-only root)
            - name: ledger
              mountPath: /var/lib/redevops/ledger
      volumes:
        - name: config
          configMap: { name: {{ include "rr.fullname" . }}-config }
        - name: tmp
          emptyDir: { sizeLimit: {{ .Values.runtime.scratch.tmpSize }} }
        - name: data
          emptyDir: { sizeLimit: {{ .Values.runtime.scratch.dataSize }} }
        - name: aos-home
          emptyDir: { sizeLimit: {{ .Values.runtime.scratch.tmpSize }} }
        - name: ledger
          {{- if .Values.runtime.mission.ledger.persistent }}
          persistentVolumeClaim: { claimName: {{ include "rr.fullname" . }}-ledger }
          {{- else }}
          emptyDir: { sizeLimit: {{ .Values.runtime.scratch.dataSize }} }
          {{- end }}
---
{{- if .Values.runtime.mission.ledger.persistent }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rr.fullname" . }}-ledger
  labels: {{- include "rr.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.runtime.mission.ledger.size }}
  {{- with .Values.runtime.mission.ledger.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  type: {{ .Values.runtime.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: {{ .Values.runtime.http.port }}
      targetPort: http
    {{- if .Values.runtime.grpc.enabled }}
    - name: grpc
      port: {{ .Values.runtime.grpc.port }}
      targetPort: grpc
    {{- end }}
