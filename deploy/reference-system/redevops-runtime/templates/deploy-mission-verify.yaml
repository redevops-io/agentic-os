{{- if .Values.deployMission.verify.enabled }}
# ── Deploy-as-a-Mission: the verification gate ──
# A vendor blueprint's install ends at `kubectl apply`. Here the install is a governed Mission: this
# post-install/post-upgrade Helm hook runs acceptance checks against the freshly deployed runtime and,
# on any failure, fails the release (hook-failed) — the deployment equivalent of a mission that gates
# instead of silently proceeding. The Job's logs are the deployment Outcome's evidence.
# The hook runs the RUNTIME image itself (python is in it), so there is no third-party curl image to pin, and it carries the
# same hardening as the runtime pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rr.fullname" . }}-verify
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: deploy-mission-verify
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.deployMission.verify.timeoutSeconds }}
  template:
    metadata:
      labels:
        {{- include "rr.labels" . | nindent 8 }}
        app.kubernetes.io/component: deploy-mission-verify
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.runtime.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: verify
          image: {{ include "rr.runtimeImage" . | quote }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          securityContext: {{ toYaml .Values.runtime.securityContext | nindent 12 }}
          env:
            - { name: HOME, value: /tmp }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: BASE, value: "http://{{ include "rr.fullname" . }}:{{ .Values.runtime.http.port }}" }
            - { name: CHECKS, value: {{ join " " .Values.deployMission.verify.checks | quote }} }
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time, urllib.request
              base = os.environ["BASE"]
              print("deployment-mission :: verifying " + base, flush=True)
              # wait for the runtime to accept traffic, then assert each acceptance check returns 2xx.
              for path in os.environ["CHECKS"].split():
                  print("  check GET " + path, flush=True)
                  for i in range(1, 31):
                      try:
                          code = urllib.request.urlopen(base + path, timeout=5).status
                      except Exception as exc:
                          code = getattr(exc, "code", 0)
                      if 200 <= code < 300:
                          print("    ok (%s)" % code, flush=True)
                          break
                      if i == 30:
                          print("    FAIL (%s) after retries" % code, flush=True)
                          sys.exit(1)
                      time.sleep(4)
              print("deployment-mission :: PASS - governed deployment verified, Outcome recorded", flush=True)
          resources: {{ toYaml .Values.deployMission.verify.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
{{- end }}
