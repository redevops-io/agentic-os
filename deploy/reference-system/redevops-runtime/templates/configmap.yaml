apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rr.fullname" . }}-config
  labels:
    {{- include "rr.labels" . | nindent 4 }}
data:
  # Governed-execution settings the chart records for the operator. The runtime image does NOT read this file today
  # (nothing opens /etc/redevops/runtime.yaml); behaviour is set by environment variables (see README "Security defaults").
  runtime.yaml: |
    retriever:
      backend: {{ .Values.retriever.backend | quote }}
    model:
      endpoint: {{ include "rr.modelEndpoint" . | quote }}
      model: {{ .Values.model.model | quote }}
    mission:
      deny_by_default: {{ .Values.runtime.mission.denyByDefault }}
      verification: {{ .Values.runtime.mission.verification }}
      approval_webhook: {{ .Values.runtime.mission.approvalWebhook | quote }}
      ledger:
        persistent: {{ .Values.runtime.mission.ledger.persistent }}
