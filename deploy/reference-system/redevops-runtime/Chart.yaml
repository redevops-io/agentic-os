apiVersion: v2
name: redevops-runtime
description: >-
  ReDevOps Runtime Reference System — a single-command, governed deployment of the
  Context Runtime + Mission Runtime + ReDevOps RAG stack. The peer to a vendor solution
  blueprint (e.g. AMD Enterprise AI Agentic RAG), with one difference: the deployment
  itself is a governed, verifiable Mission, and execution inside the stack is deterministic,
  replayable and provenance-carrying. Runs on any Kubernetes; ROCm/Instinct-ready.
type: application
# 0.4.0-pre.1: BREAKING chart (no default image, hardened pods, NetworkPolicy; see README "Upgrading from chart 0.3.x").
# The owner sets the final chart version at release. There is deliberately no appVersion: the image is chosen by
# runtime.image.digest / runtime.image.tag, and the previous appVersion "0.3.1" named an affected image.
version: 0.4.0-pre.1
keywords:
  - redevops
  - context-runtime
  - mission-runtime
  - rag
  - reference-system
  - rocm
  - instinct
home: https://redevops.io/architecture
sources:
  - https://github.com/redevops-io
maintainers:
  - name: ReDevOps
    url: https://redevops.io
