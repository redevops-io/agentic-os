apiVersion: v2
name: redevops-runtime
description: >-
  ReDevOps Runtime Reference System — a single-command, governed deployment of the
  Context Runtime + Mission Runtime + ReDevOps RAG stack. The peer to a vendor solution
  blueprint (e.g. AMD Enterprise AI Agentic RAG), with one difference: the deployment
  itself is a governed, verifiable Mission, and execution inside the stack is deterministic,
  replayable and provenance-carrying. Runs on any Kubernetes; ROCm/Instinct-ready.
