# ReDevOps Runtime Reference System — values.
# A vendor blueprint packages a deployable stack; this packages the same, and additionally makes the
# deployment a governed Mission (plan → gate → apply → verify → record) and keeps execution deterministic.

nameOverride: ""
fullnameOverride: ""

# ── the runtime service: Context Runtime + Mission Runtime, exposed as a standing HTTP/gRPC service ──
# (the Go zero-dependency core service; missions run WITHOUT a model — the model is only for narration
# and the answer/OpenIE arms.)
# The PUBLIC Python runtime — agentic_os.control_plane built from the public redevops-io/agentic-os
# repo (dashboard + /health + runnable missions + approvals). Go/Kotlin runtimes ship as separate,
# private charts (the commercial 'on request' layer).
runtime:
  image:
    repository: ghcr.io/redevops-io/redevops-runtime
    # NO DEFAULT IMAGE. The published tags 0.3.0, 0.3.1 and v6 are deprecated and unsupported, so the chart refuses them
    # and renders only when one of these is set:
    digest: ""                     # PREFERRED, immutable: sha256:<64 lowercase hex>  -> repository@sha256:...
    tag: ""                        # or a fixed MAJOR.MINOR.PATCH version tag (never latest, stable, v6, 0.3.0, 0.3.1)
    # Once a release image is published AND verified (signature + attestations), the default may become its digest in a
    # follow-up commit (see docs/release/CONTAINER_ACCEPTANCE_CRITERIA.md, section "When the image is public").
    pullPolicy: IfNotPresent
  replicas: 1
  # Name of an EXISTING Secret holding the key AGENTIC_OS_CONTROL_TOKEN (a long random value; never put it in values).
  # The runtime's mutating routes answer 503 until it is set, then require `Authorization: Bearer <token>`; /health (the
  # probes) never needs it. So the token is REQUIRED for any use beyond the health checks. Create it with:
  #   kubectl create secret generic <name> --from-literal=AGENTIC_OS_CONTROL_TOKEN="$(openssl rand -hex 32)"
  controlTokenSecret: ""
  service:
    type: ClusterIP                # exposure (NodePort / LoadBalancer) only by an explicit value; the chart has no Ingress
  # Pod and container hardening (the acceptance criteria). Maps MERGE with these defaults, so a single field can be
  # overridden explicitly, e.g. --set runtime.securityContext.readOnlyRootFilesystem=false.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001               # the image's `app` user (Dockerfile: USER 10001:10001)
    runAsGroup: 10001
    fsGroup: 10001                 # makes the ledger volume writable by the service user
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true   # writable paths are the explicit emptyDir mounts in templates/runtime.yaml
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }
  # Size caps of the writable emptyDir mounts (/tmp, /data = AGENTIC_OS_HOME, /app/.agentic-os).
  scratch:
    tmpSize: 256Mi
    dataSize: 1Gi
  # Explicit health checks: GET /health on the http port (open without a credential).
  probes:
    startup:   { periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 30 }
    readiness: { periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
    liveness:  { periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
  http:
    port: 8080
  grpc:
    enabled: false
    port: 50051
  resources:
    requests: { cpu: "500m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi" }
  # Governed-execution settings recorded in the ConfigMap (templates/configmap.yaml). The runtime image does not read the
  # ConfigMap; only ledger.persistent has an effect here (the grants volume is a PVC instead of an emptyDir).
  mission:
    # deny-by-default: no capability runs without an explicit grant.
    denyByDefault: true
    # every mission is event-sourced + replayable; keep the ledger on a PVC for durable replay.
    ledger:
      persistent: true
      size: 5Gi
      storageClass: ""
    # human approval gate for side-effecting missions ("" webhook = auto-approve in non-prod).
    approvalWebhook: ""
    # verification is on: a mission's terminal state must replay identically.
    verification: true

# ── the permissions plane's at-rest key: an EXTERNAL Secret, no default ──
# Create the Secret once, on purpose:
#   agentic-os permissions key --env-file permissions.env --k8s-secret redevops-permissions-key
#   (run the kubectl command it prints, then delete permissions.env)
# and set keySecret to its name. The chart FAILS TO RENDER while keySecret is empty (checked with `helm template`; no cluster install
# was tested); there is no default key.
permissions:
  keySecret: ""                   # REQUIRED: name of a Secret holding PERMISSIONS_KEY (never put a key in values)

# ── v0.3.0 intrinsic-security + telemetry plugins (Enterprise Edition) ──
# The canonical security/telemetry CONTRACTS are open (runtime-contracts@0.3.0, already the runtime's
# dependency); the ENFORCEMENT planes — sandbox, Vault credential broker, correlation → containment, SIEM
# export, adversarial corpus — and the OpenTelemetry bridge are the private `runtime-plugins-enterprise`
# package, injected in-process by the runtime at boot. Enabling them requires an enterprise runtime image
# that bundles that package (the public ghcr.io/redevops-io/redevops-runtime image cannot import it) —
# set security.image below. All off by default; the open runtime is unchanged when disabled.
security:
  enabled: false
  image:
    repository: ""                # e.g. ghcr.io/redevops-io/redevops-runtime-enterprise (bundles the plugins)
    digest: ""                    # REQUIRED with a repository: sha256:<64 hex> (or a fixed version tag below); no default
    tag: ""
  sandbox:
    enabled: true                 # route isolation-declaring capabilities through the SubprocessSandbox (fail-closed)
  # ── authority-scoped credential brokerage (runtime-contracts SecretStore/CredentialBroker seams) ──
  # The runtime holds SecretRefs; a capability receives a short-lived, authority-scoped CredentialGrant only
  # at the execution boundary — the secret never enters a plan/context/fingerprint/telemetry/lakehouse. The
  # OPEN runtime ships env/file dev providers + a development LocalCredentialBroker; the Vault/OpenBao
  # PRODUCTION broker (dynamic secrets, leases, revocation, Transit) is the enterprise plugin below.
  credentialBroker:
    enabled: false
    backend: local               # local (dev env/file) | vault | openbao — vault/openbao need security.image
    assurance: development       # development | production. A capability declaring production_broker_required
                                 # rejects a 'development' broker and (with failClosed) does not run.
    failClosed: true             # a declared production credential requirement with no production broker blocks execution
    # backend: vault | openbao — the enterprise broker's connection + workload auth (never a static root token).
    vault:
      addr: ""                   # e.g. https://vault.vault:8200
      namespace: ""              # per-tenant path/namespace prefix, e.g. secret/data/redevops/{tenant_id}
      auth:
        method: kubernetes       # kubernetes | approle | aws | azure | gcp (prefer workload-native auth)
        role: ""                 # Vault/OpenBao role bound to the runtime's workload identity
        approleSecret: ""        # name of a Secret with the AppRole secret_id (bootstrap material) — only if method=approle
      transit:
        enabled: false           # KeyService via Vault/OpenBao Transit — sign/HMAC/encrypt with NON-exportable keys
  # Boundary correlation → GovernanceDisposition → Containment; export dispositions (redacted) to a SIEM.
  siemEndpoint: ""

# ── Mission-native OpenTelemetry — the interoperability/export layer over the native trace ──
# The Mission is the root trace; a deployment substrate nests under it. Point at an existing OTLP collector
# (fronting Tempo/Jaeger); the runtime is the semantic source of truth, OTel is the export.
telemetry:
  otel:
    enabled: false
    endpoint: ""                  # OTLP collector, e.g. http://otel-collector.monitoring:4317
    serviceName: redevops-mission

# ── retrieval (ReDevOps RAG). backend = inmemory (demo) | pgvector (managed-DB-friendly) ──
retriever:
  backend: pgvector
  pgvector:
    # Point at Azure Database for PostgreSQL / AWS RDS / Cloud SQL + pgvector, or the bundled one below.
    dsn: ""                       # e.g. postgres://user:pass@host:5432/redevops_rag?sslmode=require
    dsnSecret: ""                 # preferred over dsn: name of an existing Secret with key RDO_PGVECTOR_DSN
    bundled:
      enabled: false              # opt-in demo database (it was on by default with a literal password; now off, see README)
      # Third-party image, pinned by digest (the pg16 index digest also used in deploy/apps/compose.yml; resolved on the
      # registry 2026-11-06, not security-scanned here). Runs as the image's postgres user (uid 999) with a read-only root.
      image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
      passwordSecret: ""          # REQUIRED when enabled: name of an existing Secret with key POSTGRES_PASSWORD
      size: 10Gi
      storageClass: ""
      resources:
        requests: { cpu: "250m", memory: "256Mi" }
        limits:   { cpu: "1",    memory: "1Gi" }

# ── model endpoint (OpenAI-compatible). Point at an existing endpoint, OR bundle a ROCm/vLLM server. ──
model:
  # External endpoint (leave server.enabled=false to use this). Missions run without it.
  endpoint: ""                    # e.g. http://vllm.ml-services:8000/v1
  model: ""                       # served model id
  apiKeySecret: ""                # name of a Secret with key OPENAI_API_KEY (optional)
  # Optional in-cluster model server on AMD Instinct (ROCm). Turn on to make this a self-contained
  # reference system on Supermicro AMD Instinct (MI300X / MI350X 8-GPU) nodes.
  server:
    enabled: false
    image: ""                     # REQUIRED when enabled, pinned by digest: rocm/vllm@sha256:<64 hex> (no tag, no default; see profiles/amd-instinct.yaml)
    # GPU image: its user and cache paths are not verified, so runAsNonRoot and the read-only root filesystem are NOT forced
    # here (documented exceptions); the rest of the hardening (no privilege escalation, drop ALL, seccomp) applies.
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: false
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
    servedModelId: "meta-llama/Llama-3.1-8B-Instruct"
    gpus: 1                        # AMD GPUs to request (amd.com/gpu)
    resources:
      requests: { cpu: "4", memory: "32Gi" }
      limits:   { cpu: "8", memory: "64Gi" }

# ── optional Projects + Sidekick cockpit (the Mission DevOps control plane UI) ──
# The runtime (control-plane) serves its own dashboard, so the cockpit is optional/off by default;
# no public cockpit image is published (point cockpit.image at your own if you enable it).
cockpit:
  enabled: false
  image:
    repository: ghcr.io/redevops-io/cockpit
    digest: ""                    # REQUIRED when enabled (sha256:<64 hex>) or a fixed version tag; no default (the old v6 tag is refused)
    tag: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }
  resources:
    requests: { cpu: "50m",  memory: "64Mi" }
    limits:   { cpu: "500m", memory: "256Mi" }
  service:
    type: ClusterIP
    port: 8240

# ── AMD Instinct / ROCm scheduling. Applied to the model server (and any GPU workload). ──
# The AMD GPU device plugin advertises `amd.com/gpu`; select Instinct nodes and tolerate their taint.
amd:
  gpuResourceName: amd.com/gpu
  nodeSelector: {}                # e.g. { amd.com/gpu.device-id: "0x74a1" } or your Instinct label
  tolerations: []                 # e.g. [{ key: amd.com/gpu, operator: Exists, effect: NoSchedule }]

# ── deploy-as-a-Mission: the post-install/upgrade verification hook ──
# The install is not "kubectl apply and hope": a Helm hook Job runs acceptance checks against the freshly
# deployed runtime, and records the result as a deployment-mission Outcome (provenance + verify). If the
# checks fail, the release is marked failed — the governed-deployment equivalent of a mission that gates.
deployMission:
  verify:
    enabled: true
    # The hook runs the RUNTIME image itself (python urllib, no third-party curl image to pin); there is no `image` value.
    resources:
      requests: { cpu: "10m",  memory: "32Mi" }
      limits:   { cpu: "200m", memory: "128Mi" }
    # acceptance checks the hook runs (HTTP GET against the runtime; non-2xx fails the release).
    checks:
      - /health
    timeoutSeconds: 120

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false   # the runtime does not call the Kubernetes API; no token is mounted

podAnnotations: {}
# Pull secrets for PRIVATE packages (for example a staged-* package on GHCR): [{ name: ghcr-pull }]
imagePullSecrets: []

# ── network: default-deny NetworkPolicy (needs a CNI that enforces NetworkPolicy; others ignore the object) ──
# ENABLED BY DEFAULT: a default install touches only DNS and (when enabled) the bundled pgvector / model server, all
# allowed below, and the verify hook and cockpit of this release are allowed in. Anything else is an explicit opt-in:
# add the callers to ingress.from and every external endpoint (model.endpoint, OTLP, Vault, SIEM, an external Postgres
# DSN, connected modules) to egress.extraRules. The chart prints a warning in NOTES when it sees such endpoints.
networkPolicy:
  enabled: true
  ingress:
    from: []                      # extra NetworkPolicyPeer entries allowed to reach the runtime, e.g. [{ namespaceSelector: { matchLabels: { team: edge } } }]
  egress:
    restrict: true                # false = leave the runtime egress unrestricted (not recommended)
    dnsTo:                        # where DNS lives (port 53 udp/tcp)
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
    extraRules: []                # raw NetworkPolicyEgressRule entries, e.g. [{ to: [{ ipBlock: { cidr: 198.51.100.0/24 } }], ports: [{ port: 8000 }] }]
