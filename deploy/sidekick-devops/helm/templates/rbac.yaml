apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sidekick
  namespace: {{ .Release.Namespace }}
---
# Read-only inspection: pods + metrics-server, get/list only. Sidekick never mutates the cluster
# through this identity — side-effecting actions run through gated missions with your own runners.
kind: {{ if .Values.rbac.clusterWide }}ClusterRole{{ else }}Role{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-sidekick-reader
  {{- if not .Values.rbac.clusterWide }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
kind: {{ if .Values.rbac.clusterWide }}ClusterRoleBinding{{ else }}RoleBinding{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-sidekick-reader
  {{- if not .Values.rbac.clusterWide }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.rbac.clusterWide }}ClusterRole{{ else }}Role{{ end }}
  name: {{ .Release.Name }}-sidekick-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-sidekick
    namespace: {{ .Release.Namespace }}
