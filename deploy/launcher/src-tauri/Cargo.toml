[package]
name = "redevops-launcher"
version = "0.1.0"
description = "ReDevOps desktop shell — a native window around the same Today-first UI the browser uses"
edition = "2021"
license = "AGPL-3.0-or-later"

# The desktop shell is a DELIVERY SURFACE, not a control plane: it holds a connection (URL + a credential in the OS
# keychain), shows the deployment's own UI, and adds native affordances (tray, deep links, window restore). It owns no
# approvals, scheduling, case storage, notification state or agent execution — see ../DESKTOP.md.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
tokio = { version = "1", features = ["time"] }
# plain blocking HTTP with rustls (no OpenSSL on Windows/Linux); redirects are disabled in code
ureq = { version = "2", default-features = false, features = ["tls"] }
# OS credential store: Keychain (macOS), Credential Manager (Windows), Secret Service (Linux). No plaintext fallback.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Linux only: tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption { .. }` with a struct literal, which stops compiling once
# rust-ini adds fields (0.21.2+ did). Found by CI — a macOS lockfile never compiles that Linux-only path. Remove this pin when
# the plugin is fixed upstream.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
# Test-only hook: load the deployment, read what the page rendered, report it to a local port, exit. Never shipped.
selftest = []

[profile.release]
lto = true
codegen-units = 1
strip = true
