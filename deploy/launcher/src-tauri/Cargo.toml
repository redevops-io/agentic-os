[package]
name = "redevops-launcher"
version = "0.1.0"
description = "ReDevOps Launcher — native one-click for the agentic app (Windows/macOS)"
edition = "2021"
license = "AGPL-3.0-or-later"

# SCAFFOLD: not built in CI. `cargo tauri dev` / `cargo tauri build` on a dev machine.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
