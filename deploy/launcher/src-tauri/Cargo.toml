[package]
name = "redevops-launcher"
version = "0.1.0"
description = "ReDevOps Launcher — native one-click for the agentic app (Windows/macOS)"
edition = "2021"
# No SPDX `license` field: the family licence (AGPL-3.0-or-later with the Commons Clause) has no
# registered SPDX id, and plain "AGPL-3.0-or-later" would omit the Commons Clause. See LICENSING.md.
license-file = "../../../LICENSING.md"
publish = false

# SCAFFOLD: not built in CI. `cargo tauri dev` / `cargo tauri build` on a dev machine.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
