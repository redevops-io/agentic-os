# Projects + Sidekick orchestration node — Projects UI + Sidekick + the parallel-workflow composer and
# A2A/MCP external-agent interop, in ONE image. No cores, no fleet, no database required.
#
#   docker compose up -d
#   # Projects UI      → http://localhost:8290/
#   # Workflows console → http://localhost:8290/workflows
#
# The image is PRIVATE (GHCR): it carries the enterprise code, so `docker login ghcr.io` with an account ReDevOps granted access to first.
# Only the kernel source is available (source-available under the family licence); the enterprise overlay is private.
# Bring your own model endpoint (local or cloud) and only the external-agent / channel credentials you use.
services:
  projects-sidekick:
    image: ghcr.io/redevops-io/agentic-projects-sidekick:${IMAGE_TAG:-stable}
    pull_policy: always
    ports:
      - "${HTTP_PORT:-8290}:8290"
    environment:
      # ── BYO model (the one real dependency) — a local engine OR a cloud endpoint ──
      - REDEVOPS_LLM_BASE_URL=${REDEVOPS_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - REDEVOPS_LLM_MODEL=${REDEVOPS_LLM_MODEL:-qwen3.5}
      # Optional cloud keys (e.g. for multi-vendor agent dispatch). Leave blank to stay fully local.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── Optional: external-agent endpoints + channel credentials, as needed ──
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      # What fronts this service (docs/SECURITY_MODEL.md, "Route-policy enforcement does not wait for the
      # profile"). The port is published, so the bind inside the container has to be routable and every peer
      # address is enforced; `AGENTIC_OS_BEHIND_PROXY=0` states that as shipped nothing forwards to it.
      # Front it with a reverse proxy and set FORWARDED_ALLOW_IPS=<proxy address> instead — leaving the front
      # unstated enforces too, so the only way to get the advisory (development) posture is to claim the
      # service is reachable from this machine only, which a published port does not support.
      - AGENTIC_OS_BIND_HOST=${AGENTIC_OS_BIND_HOST:-0.0.0.0}
      - AGENTIC_OS_BEHIND_PROXY=${AGENTIC_OS_BEHIND_PROXY:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach a model on the host (ollama/llama.cpp)
    restart: unless-stopped
