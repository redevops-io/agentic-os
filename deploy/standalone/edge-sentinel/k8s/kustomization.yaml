apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge-sentinel
resources:
  - namespace.yaml
  - crowdsec.yaml
  - edge-sentinel.yaml
  - networkpolicy.yaml
# pin another image (a digest is best) without editing the manifest:
#   kustomize edit set image ghcr.io/redevops-io/edge-sentinel=ghcr.io/redevops-io/edge-sentinel@sha256:<digest>
images:
  - name: ghcr.io/redevops-io/edge-sentinel
    newTag: 0.6.3
