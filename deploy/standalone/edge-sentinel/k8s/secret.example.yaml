# Shape of the Secret the Deployments read. NOT part of kustomization.yaml and holds no values: bootstrap.sh creates the real
# Secret with random values, or create it yourself:
#   kubectl -n edge-sentinel create secret generic edge-sentinel \
#     --from-file=operator-password=<file> --from-file=crowdsec-bouncer-key=<file> --from-file=crowdsec-machine-password=<file> --from-file=control-token=<file> --from-file=approval-secret=<file>
apiVersion: v1
kind: Secret
metadata:
  name: edge-sentinel
  namespace: edge-sentinel
type: Opaque
stringData:
  operator-password: ""
  crowdsec-bouncer-key: ""
  crowdsec-machine-password: ""
  control-token: ""
  approval-secret: ""
