  apollo:
    auth: api_key
    capabilities:
      outreach.observe:            {status: VERIFIED, tier: 1, write: false, verification: contract}
      contact.enrich:              {status: VERIFIED, tier: 1, write: false, verification: contract}
      company.enrich:              {status: VERIFIED, tier: 1, write: false, verification: contract}
      contact.upsert:              {status: VERIFIED, tier: 2, write: true,  verification: contract}
      outreach.sequence.configure: {status: VERIFIED, tier: 3, write: true,  verification: contract}
      outreach.enroll:             {status: VERIFIED, tier: 3, write: true,  verification: contract}
      outreach.sequence.activate:  {status: VERIFIED, tier: 4, write: true,  verification: contract, human_required: true}

  klaviyo:
