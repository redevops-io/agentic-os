# Business-connector capability registry (plan §5) — the counterpart to the external-agent capability
# audit, for the redevops-connectors business SaaS adapters.
#
# "Never claim an integration merely because an API exists." Status vocabulary:
#   VERIFIED             the capability is confirmed — here, contract-verified by the connector's
#                        conformance suite + fixtures (advertise-only-implemented, envelope-gating,
#                        idempotency, observe-roundtrip, no-credential-leak). `verification: contract`.
#   AVAILABLE_UNVERIFIED an adapter path exists but is not covered by the conformance/fixture suite.
#   UNKNOWN              no evidence either way (the safe default; treated as unavailable).
#   UNSUPPORTED          the provider/capability is not implemented.
#   POLICY_BLOCKED       available but blocked by policy (e.g. commercial-use / provider terms).
#
# `verification: contract` means the CONTRACT is proven against fixtures, NOT that a live provider
# account has been exercised — that is a per-connection fact (redevops_connectors SetupState:
# VERIFIED_READ / VERIFIED_WRITE), recorded at connect time, not here.
#
# Each capability: {status, tier (0-4), write (bool), auth}. This file is generated to match the
# adapters' advertised capabilities; tests/test_integration_business.py asserts it does not drift.

contract_version: connector-capability/v1
audited_at: "2026-09-22"

providers:

  slack:
    auth: oauth
    capabilities:
      chat.message.read:   {status: VERIFIED, tier: 1, write: false, verification: contract}
      identity.read:       {status: VERIFIED, tier: 1, write: false, verification: contract}
      chat.message.send:   {status: VERIFIED, tier: 3, write: true,  verification: contract}
