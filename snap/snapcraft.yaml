# Ubuntu Snap Store packaging of Agentic Apps R0-prime. Registered and published by the owner to the `railsapps`
# Store listing's edge channel (public, 2026-11-19/20); see docs/release/SNAP_STORE.md for every decision it needed.
#
# Design: the snap carries EXACTLY the payload of the .deb that `cargo tauri build --bundles deb` produces from the
# pinned pipeline (packaging/build-wheelhouse.sh -> build-sidecar.sh -> build-notices.sh -> build-sidecar.sh ->
# stage-sidecar.sh -> build-launcher.sh), unpacked with dpkg-deb. There is no second build recipe: whatever the pins
# say for the .deb they say for the snap.
#
# Confinement is STRICT, with the smallest interface set the app needs and nothing more:
#   network       the control plane calls hosted-model / connector APIs the user configures (outbound)
#   network-bind  the control plane listens on 127.0.0.1 (the local UI + API)
#   docker        owner decision O-SNAP-2 (docs/release/SNAP_STORE.md), applied 2026-11-20: lets the "Apps" screen
#                 drive `docker compose` against deploy/apps/compose.yml's profiled services. super-privileged -
#                 not auto-connected; the user runs `snap connect railsapps:docker` themselves, and it needs a Snap
#                 Store manual-review grant before that connect can succeed for anyone, including the owner. Grants
#                 socket access ONLY (confirmed: a strict snap cannot exec a host binary at all), which is why the
#                 CLI below is bundled INTO the snap rather than assumed present on the host.
#   + the `gnome` extension's own plugs (desktop, desktop-legacy, gsettings, opengl, wayland, x11) for the GTK/WebKit window
# NOT requested: home, removable-media, system-files, ssh-keys, password-manager-service, process-control,
# classic confinement. CORRECTION (checked in a real confined run, not assumed): bundling `docker` does NOT make
# the launcher's pre-existing "Advanced · local containers" buttons (a different, unrelated bundle -
# deploy/sidekick-devops, Sidekick + observability) work under the snap. Two separate reasons, neither fixed by
# this change: `docker compose` is not discovered as a subcommand inside the snap's confinement at all (the CLI's
# plugin search paths do not include $SNAP's own - the new Apps commands in main.rs work around this by invoking
# the bundled compose plugin binary directly; advanced_docker_up/down/purge were not changed and still dispatch
# through `docker compose`, so they still fail this way), and separately `deploy/sidekick-devops/` itself is not
# staged into the snap at all (only deploy/apps/ is, for the Apps screen). `docker_available()` does return true
# under the snap now (a real, bundled `docker` binary exists on PATH), which makes those buttons visible per the
# existing UI gate - clicking them still fails, for the two reasons above. No `SNAP` env-var kill-switch exists
# in main.rs (docs/release/SNAP_STORE.md's O-SNAP-4 was deliberately not taken) - fixing this properly (either
# wiring sidekick-devops into the snap the same way deploy/apps/ was, or hiding those buttons under SNAP) is
# follow-up work, not done here.
name: railsapps                     # registered by the owner on the Snap Store under their account (`snapcraft register railsapps`)
title: Agentic Apps R0-prime
base: core24
adopt-info: app
summary: Local AI automation for business apps - you stay in control
description: |
  ## rAIls Apps — Local AI Automation for Business Applications

  rAIls Apps brings AI-powered business automation to your own computer. Connect applications, coordinate
  workflows across them, and run intelligent agents while retaining control over important decisions.

  Built on the Runtime Agentic Intelligence (rAIls) stack, it provides a local control plane accessible through
  your web browser. The control plane listens only on 127.0.0.1, keeping its interface local to your machine.
  Bring your own AI model and choose how your workflows operate.

  **What you can do:**

  - Connect business applications and coordinate cross-application workflows.
  - Run AI-assisted missions with human approval for consequential actions.
  - Use your own AI models rather than depending on a single provider.
  - Manage workflows through a browser-based local control plane.
  - Optionally deploy a tested suite of business applications, including Twenty CRM, Metabase and Postiz, alongside
    specialized agents for revenue, intelligence, content, finance, customer success, and security and compliance.

  **Docker is optional.** The control plane runs without Docker. Deploying the additional business applications
  requires Docker and access to the Snap's Docker interface, subject to Snap Store approval.

  rAIls Apps is designed to make agentic automation practical, transparent and controllable, connecting AI
  reasoning with real business operations.

  Private, unsigned build for testing; not yet a stable release.
grade: devel                        # `stable` only when the owner decides to release; the store refuses devel on stable/candidate
confinement: strict
platforms:
  amd64:
  arm64:

environment:
  # Persistent data must survive a snap refresh WITHOUT being copied per revision ($SNAP_USER_DATA is versioned and is
  # copied by snapd on every refresh): the app's home-relative stores go to $SNAP_USER_COMMON (see bin/agentic-apps-snap).
  RDO_SNAP: "1"

apps:
  railsapps:
    command: bin/agentic-apps-snap
    extensions: [gnome]
    plugs: [network, network-bind, docker]

parts:
  app:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - build-essential
      - curl
      - git
      - pkg-config
      - ca-certificates
      - dpkg-dev
      - file
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - librsvg2-dev
      - libayatana-appindicator3-dev
      - patchelf
      - rsync
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - xdg-utils
      # Pinned exact versions (verified present in the core24/noble archive, 2026-11-20 - see
      # docs/release/SNAP_STORE.md's O-SNAP-2 update for how these were chosen and confirmed). docker.io also pulls
      # in dockerd, which this snap never runs (it only ever talks to the HOST's daemon via the docker interface's
      # socket) - dropped below in `prime`, along with man pages/docs/completions/systemd units nothing here uses.
      - docker.io=24.0.7-0ubuntu4
      - docker-compose-v2=2.24.6+ds1-0ubuntu2
    prime:
      - -usr/bin/dockerd
      - -etc/docker
      - -usr/lib/systemd/system/docker.service
      - -usr/lib/systemd/system/docker.socket
      - -usr/share/bash-completion/completions/docker
      - -usr/share/doc/docker.io
      - -usr/share/docker.io
      - -usr/share/lintian/overrides/docker.io
      - -usr/share/man/man1/docker-*
    override-build: |
      set -eux
      sh "$CRAFT_PART_SRC/snap/local/build-payload.sh" "$CRAFT_PART_SRC" "$CRAFT_PART_BUILD" "$CRAFT_PART_INSTALL"
      install -Dm644 "$CRAFT_PART_SRC/deploy/apps/compose.yml" "$CRAFT_PART_INSTALL/apps/compose.yml"
      install -Dm644 "$CRAFT_PART_SRC/deploy/apps/Caddyfile" "$CRAFT_PART_INSTALL/apps/Caddyfile"
      install -Dm644 "$CRAFT_PART_SRC/deploy/apps/.env.example" "$CRAFT_PART_INSTALL/apps/.env.example"
      craftctl set version="$(python3 -I "$CRAFT_PART_SRC/packaging/tools/identity.py" get version)"
