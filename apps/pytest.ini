[pytest]
# apps/*/test_operator.py (and friends) share basenames across apps; importlib mode lets `pytest apps` collect them in one run.
addopts = --import-mode=importlib
# the hyphenated app packages (document-editor, edge-sentinel, ...) import as namespace packages under apps/
pythonpath = .
markers =
    integration: needs a real external service (e.g. a throwaway ONLYOFFICE Document Server); skipped unless configured
