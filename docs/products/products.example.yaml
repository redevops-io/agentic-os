# Products registry for Projects and Sidekick (docs/products/README.md). Point AGENTIC_OS_PRODUCTS at a copy of this file.
# Secrets are FILE references only; never put a token in this file.
schema: aos.products/v1
allow_private_http: [edge-sentinel]      # plain-http service names on a private network; loopback is always allowed
keep_sample_rows: false                  # product rows replace the sample demo rows in Missions, Attention and Activity
principal:
  single_owner: local-owner              # ONLY for a Projects that exactly one person can reach (desktop, loopback Compose)
products:
  - id: edge-sentinel
    display_name: Edge Sentinel
    kind: security                       # security | quality (the Sidekick domain)
    api_base: http://edge-sentinel:8203  # server to server
    ui_url: http://127.0.0.1:8203/ui     # what the browser opens (path-based deep links are appended)
    health: {path: /readyz, interval_s: 15, timeout_s: 3}
    contract: {api: /api/v1, info: /api/v1/info, min_version: "1"}
    auth:
      scheme: control_token              # X-Control-Token
      service_token_file: /run/secrets/products/edge-sentinel.service_token     # reads and staging
      decision_token_file: /run/secrets/products/edge-sentinel.decision_token   # carries a person's decision/execute click
      approval_secret_file: /run/secrets/products/approval_secret               # AGENTIC_OS_APPROVAL_SECRET shared with the product
    approvals: {mode: human_click, attribute_to: product_user}
  # redevops-qa is gated (see README, "Gates"): listing it shows an explicit "unavailable: external-target acceptance not met".
  # - id: redevops-qa
  #   display_name: redevops-qa
  #   kind: quality
  #   api_base: http://127.0.0.1:8080
  #   ui_url: http://127.0.0.1:8080/ui
  #   contract: {api: /v1, info: /v1/info, min_version: "1"}
  #   auth: {scheme: bearer, service_token_file: /run/secrets/products/qa.service_token,
  #          approval_secret_file: /run/secrets/products/approval_secret}
