claim_id: voice_action_path_overhead
claim: "Governance overhead of one voice-originated action (VoiceActionBridge plus the Agent Gateway pipeline, mock CRM time subtracted): durable stores, write of a new intent p50 1.5 ms and p95 3.2 ms; read p50 2.6 ms and p95 3.4 ms; a repeated completed write p50 0.34 ms. Measured on one machine, n=300 per row."
status: Internally reproduced
code_commit: "5782f86bc5136fb33045c4bc5bac30f05169353f"
dataset: "None external. Synthetic requests generated by integrations/voice-pipecat/bench/measure_action_path.py against the in-process mock CRM; one verified session; the owner's call and rate limits lifted so that each timed write executes (the script checks the outcome of every timed call and aborts if it is not the expected status)."
protocol: "python integrations/voice-pipecat/bench/measure_action_path.py --n 300 --json, 2026-10-29, one run, agentic-os 0.4.1, Python 3.13.18, macOS arm64 (Apple silicon). Per call: wall time of VoiceActionBridge.submit minus the time the mock CRM spent inside its own methods. 20 warm-up calls per row are not reported. Two configurations: in-memory stores, and durable stores (hash-chained JSONL journal with fsync, SQLite authority envelope store and ledger)."
model: "none; no language model, no speech model"
metrics: "milliseconds, p50/p95/p99/max. Durable: read 2.555/3.381/4.078/5.065; write (new intent) 1.508/3.203/6.238/6.904; replay of a completed write 0.339/0.375/1.348/1.656; refusal (not allowlisted) 0.073/0.083/0.095/0.788. In-memory: read 0.086/0.092/0.133/0.299; write 0.187/0.199/0.265/0.267; replay 0.053/0.055/0.057/0.116; refusal 0.009/0.010/0.011/0.013."
baselines: "NOT_IN_REPO. No comparison with any other system or with an ungoverned call was run. Earlier runs of the same script, on agentic-os 0.4.0 and before replays were revalidated, gave the same order of magnitude; the replay row grew once the bridge began to check entitlement before answering from its journal."
reproduce: "cd integrations/voice-pipecat && python bench/measure_action_path.py --n 300 --json"
artifacts: "integrations/voice-pipecat/bench/measure_action_path.py; integrations/voice-pipecat/tests/test_governance_latency.py (loose ceilings used as a regression guard)"
limitations: "One machine, one run, no confidence interval. Excludes the speech path entirely (audio, speech-to-text, model, text-to-speech, network), which is not measured anywhere in this repository. os.fsync on macOS does not force data to the physical medium, so the durable figures understate a Linux disk with a real flush. The dominant cost is the existing SQLite authority ledger opening a connection per transaction; reads measured slower than writes in this run and the reason was only partly traced (final-connection close cost). Not a statement about any deployment, load, or competitor."
review: "none; no external review"
