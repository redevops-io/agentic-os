claim_id: search_relevance_sanity
claim: "With the local bge-small embedder and the default clamp01 map, the SR-04 relevance hook scored 12 invented queries against their own invented page 0.655-0.866 (mean 0.766, n=12 pairs) and against the 5 other invented pages 0.354-0.603 (mean 0.475, n=60 pairs); each query's top-scoring page was its own page in 12 of 12 cases. One unrelated pair reached 0.603, above the 0.6 detector threshold. With the halfcosine map every unrelated pair was at least 0.677, so all 60 would clear 0.6. Keyword stuffing is a residual: one honest page scored a mean 0.517 against the 12 queries (2/12 at or above 0.6), the same page with every query pasted into its body 0.624 (8/12) before and 0.613 (8/12) after the repeat-collapse mitigation, and 0.608 (7/12) with each query pasted once."
status: Illustrative/synthetic
code_commit: "21785cc621965c84708bd2c844e9e003c300a69e"
dataset: "None external. Six invented pages (title, H1, meta description, two sentences of body) and twelve invented queries written for scripts/search_relevance_sanity.py. No real site, no Search Console data, no customer text. The author decided which page each query is about."
protocol: "HF_HUB_OFFLINE=1 python scripts/search_relevance_sanity.py --json, 2026-11-22, one run, CPU, macOS arm64, Python 3.15.2, sentence-transformers 6.3.0, torch 2.15.0. Embedder BAAI/bge-small-en-v1.5 (cached snapshot 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a; the hook recorded revision probe:02f095e02af6). Each query is scored against all six pages with make_relevance_fn (maps clamp01 and halfcosine)."
model: "BAAI/bge-small-en-v1.5 via sentence-transformers, embeddings only; no chat model"
metrics: "clamp01: related mean 0.766 (min 0.655, max 0.866, n=12), unrelated mean 0.475 (min 0.354, max 0.603, n=60), pairwise related>unrelated 1.000, top page correct 12/12, unrelated pairs >= 0.6: 1, related pairs >= 0.6: 12. halfcosine: related mean 0.883 (0.827-0.933), unrelated mean 0.737 (0.677-0.801), pairwise 1.000, top page correct 12/12, unrelated pairs >= 0.6: 60. Stuffing (clamp01, backup page vs the 12 queries; mitigation on / off): honest page mean 0.517 / 0.517 (2/12 at or above 0.6); body stuffed with all queries twice 0.613 / 0.624 (8/12 / 8/12); body with all queries once 0.608 / 0.608 (7/12 / 7/12)."
baselines: "NOT_IN_REPO. No lexical or other baseline was run."
reproduce: "pip install sentence-transformers (cache BAAI/bge-small-en-v1.5), then HF_HUB_OFFLINE=1 python scripts/search_relevance_sanity.py --json"
artifacts: "scripts/search_relevance_sanity.py; agentic_os/content/relevance.py; tests/test_search_relevance_hook.py (unit tests use a deterministic fake embedder, not this model)"
limitations: "n is tiny (12 queries, 6 pages), the pages and queries are author-written and topically very distinct, so separation is easy by construction; the author assigned the ground truth. It says nothing about real pages, real queries, near-duplicate topics, rankings, CTR or conversion, and does not validate the 0.6 / 0.9 detector thresholds, which pre-date any relevance supplier. The stuffing rows use one honest page and 12 queries only. Validation against real Search Console data is unperformed (docs/SEARCH_RELEVANCE.md)."
review: "none; no external review"
