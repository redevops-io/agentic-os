# The control plane. Modules are brought up by `agentic-os up <name>` (each ships its own compose).
services:
  control-plane:
    build: .
    command: uvicorn agentic_os.control_plane:app --host 0.0.0.0 --port 8080
    # Published on loopback only. To reach it from another machine set AOS_BIND_ADDR (see docs/CONTROL_PLANE_SECURITY.md,
    # "Network exposure"): 0.0.0.0 exposes the control plane to every network the host is on.
    # See docs/release/CONTAINER_ACCEPTANCE_CRITERIA.md for the container acceptance criteria this file is checked against.
    ports: ["${AOS_BIND_ADDR:-127.0.0.1}:8080:8080"]
    environment:
      - AGENTIC_OS_CONFIG=/app/config.yaml
      - AGENTIC_OS_HOME=/data
      # What fronts this service, stated rather than assumed (docs/SECURITY_MODEL.md, "Route-policy
      # enforcement does not wait for the profile"). Tracks the same AOS_BIND_ADDR that controls the actual
      # published port above (line 9), so the declaration stays true as an operator changes it: the default
      # 127.0.0.1 is unpublished and advisory-eligible; setting AOS_BIND_ADDR=0.0.0.0 publishes it and this
      # value follows, forcing enforcement. `AGENTIC_OS_BEHIND_PROXY=0` records that nothing forwards to this
      # container as shipped; put a reverse proxy in front of it and set FORWARDED_ALLOW_IPS=<proxy address>
      # instead, so forwarded requests are read as forwarded and not as machine-local.
      - AGENTIC_OS_BIND_HOST=${AOS_BIND_ADDR:-127.0.0.1}
      - AGENTIC_OS_BEHIND_PROXY=0
      # The fleet routes (dispatch, up/down, approvals, jobs, fleet, status) answer 503 until one of these is set (both empty by default).
      - AGENTIC_OS_CONTROL_TOKEN=${AGENTIC_OS_CONTROL_TOKEN:-}
      - AGENTIC_OS_API_KEY=${AGENTIC_OS_API_KEY:-}
      # Optional READ-ONLY dashboard token (at least 24 characters, different from the two above): lets the dashboard page read the fleet, approvals, jobs and status,
      # and nothing else. Empty by default (the dashboard then needs a fleet credential).
      - AGENTIC_OS_DASHBOARD_TOKEN=${AGENTIC_OS_DASHBOARD_TOKEN:-}
      # The grant-store key: external, NO default. Created once by `make permissions-key`; the grants persist in /data.
      - "PERMISSIONS_KEY=${PERMISSIONS_KEY:?PERMISSIONS_KEY is required - create it once with make permissions-key (or agentic-os permissions key --env-file permissions.env) then run docker compose --env-file permissions.env up}"
      - PERMISSIONS_DIR=/data/permissions
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - agentic_os_data:/data
      # NOTE: do NOT bind-mount /var/run/docker.sock here. Mounting the host
      # Docker socket grants the container effective root on the host (it can
      # start privileged containers, mount the host FS, etc.). In dev the Fleet
      # shells out to `docker compose` on the host directly, so the control
      # plane container does not need access to the socket.
    restart: unless-stopped
volumes:
  agentic_os_data:
