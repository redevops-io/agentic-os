[project]
name = "agentic-os-voice-pipecat"
version = "0.1.0"
description = "Optional voice-agent integration for agentic-os: a governed action bridge and a Pipecat adapter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later WITH Commons-Clause" }
dependencies = [
    # agentic-os is not on PyPI: install it first from a release tag (see README), then this package.
    "agentic-os>=0.4.0",
    "pipecat-ai==1.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os_voice"]
artifacts = ["src/agentic_os_voice/demo/fixtures/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
