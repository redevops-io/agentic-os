[project]
name = "agentic-os-infinity"
version = "0.1.0"
description = "Optional RAP bridge for agentic-os: lets the Infinity agent runtime call governed actions through the Agent Gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later WITH Commons-Clause" }
dependencies = [
    # agentic-os is not on PyPI: install it first from a release tag (see README), then this package. 0.4.1 is the first release whose gateway
    # binds an idempotency key to its arguments and scope and revalidates a caller before serving a stored result (AuthorityGuard.check).
    # No other runtime dependency: the HTTP server, the signing scheme and the outbox use the standard library.
    "agentic-os>=0.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# development in this repository: the checkout two directories up. A consumer installs agentic-os from a release tag instead.
agentic-os = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redevops_infinity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not sidecar'"
markers = ["sidecar: runs the real Infinity runtime through the Rust harness (needs RAP_HARNESS_BIN)"]
