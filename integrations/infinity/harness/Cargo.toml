# A synthetic Infinity agent for the RAP bridge integration test. It embeds the REAL upstream runtime (infinity-agent-core 0.2.0, Apache-2.0)
# with a scripted model: no model provider, no network beyond loopback, no credentials. Versions are exact and the lock file pins their checksums.
[package]
name = "infinity-rap-harness"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later WITH Commons-Clause"

[[bin]]
name = "infinity-rap-harness"
path = "src/main.rs"

[dependencies]
infinity-agent-core = "=0.2.0"
infinity-provider-protocol = "=0.2.0"
infinity-rap-bridge = "=0.2.0"
rap-client = "=0.2.0"
rap-protocol = "=0.2.0"
async-trait = "0.1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
debug = false
