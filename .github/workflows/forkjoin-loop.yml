name: forkjoin-loop (temporary diagnostic)
on:
  push:
    branches: [fix-forkjoin-windows-flake]
permissions:
  contents: read
jobs:
  loop:
    name: loop (${{ matrix.os }}, ${{ matrix.load }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
        load: [idle, loaded]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0" "cryptography>=42" "pyyaml>=6.0" "runtime-contracts @ git+https://github.com/redevops-io/runtime-contracts.git@v0.3.14"
      - name: start CPU load
        if: matrix.load == 'loaded'
        shell: bash
        run: |
          for i in 1 2 3 4; do (python -c "while True: pass" &) ; done
      - name: the OLD recorder under simultaneous writers (3 threads, 2000 rounds)
        shell: bash
        run: python diag/append_race.py 2000
      - name: the real test, 60 times
        if: always()
        shell: bash
        run: |
          fail=0
          for i in $(seq 1 60); do
            PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_mission_fork_join_hardening.py::test_second_process_is_refused_and_each_branch_dispatches_once >/tmp/o.txt 2>&1 || { fail=$((fail+1)); echo "=== run $i FAILED"; tail -25 /tmp/o.txt; }
          done
          echo "REAL TEST RESULT $((60-fail))/60 passed"
          [ "$fail" -eq 0 ]
      - name: the whole hardening module with the new regression test, 20 times
        if: always()
        shell: bash
        run: |
          fail=0
          for i in $(seq 1 20); do
            PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_mission_fork_join_hardening.py >/tmp/o2.txt 2>&1 || { fail=$((fail+1)); echo "=== module run $i FAILED"; tail -25 /tmp/o2.txt; }
          done
          echo "MODULE RESULT $((20-fail))/20 passed"
          [ "$fail" -eq 0 ]
