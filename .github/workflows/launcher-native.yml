name: launcher-native

# The native launcher (deploy/launcher/src-tauri) compiled and tested on every change that touches it, on the three desktop systems.
# The browser tests of its page (tests/test_launcher_page_browser.py) do not qualify the Rust: this does. It runs
#   1. `cargo test --locked`: the launcher's own unit tests, including the argument validators of the agent commands;
#   2. the agent commands through a REAL sidecar (the source entry under CPython, from the locked environment):
#      connect, list and disconnect, with the token file private and its value never returned to the launcher.
# It builds no installer, signs nothing and publishes nothing; the sidecar is a stub only so that Tauri's build script finds
# the file its `externalBin` names. (Installers: native-packaging.yml.)

on:
  pull_request:
    paths:
      - "deploy/launcher/**"
      - "agentic_os/local_agents.py"
      - "packaging/sidecar_main.py"
      - ".github/workflows/launcher-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.10"
          check-latest: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.12.16"

      - name: Rust toolchain 1.98.1 (packaging/toolchain.env RUST_VERSION)
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7  # branch 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Linux libraries Tauri links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: The locked Python environment the source sidecar runs in
        shell: bash
        run: uv sync --frozen

      - name: Files Tauri's build script looks for (a stub sidecar, an empty Licenses folder)
        shell: bash
        working-directory: deploy/launcher/src-tauri
        run: |
          triple="$(rustc -Vv | sed -n 's/host: //p')"
          mkdir -p binaries licenses
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          : > "binaries/redevops-sidecar-${triple}${ext}"
          echo "generated at build time; not part of this check" > licenses/README.txt

      - name: cargo test --locked
        shell: bash
        working-directory: deploy/launcher/src-tauri
        run: cargo test --locked

      - name: The agent commands through a real sidecar
        shell: bash
        working-directory: deploy/launcher/src-tauri
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"; else py="$GITHUB_WORKSPACE/.venv/bin/python"; fi
          RDO_TEST_PYTHON="$py" cargo test --locked agents_commands -- --ignored --test-threads=1 --nocapture
