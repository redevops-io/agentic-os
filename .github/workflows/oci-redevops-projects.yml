# Publishes the standalone image ghcr.io/redevops-io/redevops-projects, built from Dockerfile.projects on the
# protected branch release/0.6.0. Manual dispatch only: a person types the confirmation.
# Why this exists (2026-11-19): oci-redevops-ts-bundle.yml never rebuilds the three component images, it only
# re-packages a Compose bundle around EXISTING ones; and the only prior publisher of this image, main's own
# oci-release.yml, builds from main's own (older, divergent) packaging/projects_ui.lock.json, never from
# release/0.6.0's. There was no working path to publish a redevops-projects image that actually reflects this
# branch's Projects UI pin (see packaging/PINS.md's 2026-11-19 entry) until this file.
# Same shape as oci-edge-sentinel.yml (pinned actions, keyless signing, provenance, no overwrite, a smoke test
# before signing), adapted to dispatch from release/0.6.0 directly (like oci-redevops-ts-bundle.yml) since this
# product has no release-tag convention on this branch yet, and to validate the tag against pyproject.toml's own
# version instead of a git tag.
# Consumers verify with:
#   cosign verify ghcr.io/redevops-io/redevops-projects@sha256:<index digest> \
#     --certificate-identity 'https://github.com/redevops-io/agentic-os/.github/workflows/oci-redevops-projects.yml@refs/heads/release/0.6.0' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: oci-redevops-projects
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, must equal pyproject.toml's [project].version on this branch, for example 0.4.1"
        required: true
      confirm:
        description: "Type exactly: PUBLISH <tag>"
        required: true
permissions:
  contents: read
concurrency:
  group: oci-redevops-projects
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      NAME: redevops-projects
      FILE: Dockerfile.projects
      TAG: ${{ inputs.tag }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Check the confirmation, the tag, and the branch
        run: |
          [ "$CONFIRM" = "PUBLISH $TAG" ] || { echo "the confirmation does not match: type PUBLISH $TAG"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/release/0.6.0" ] || { echo "dispatch from the protected branch release/0.6.0 only (got $GITHUB_REF)"; exit 1; }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build inputs
        id: vars
        run: |
          PYPROJECT_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          [ "$PYPROJECT_VERSION" = "$TAG" ] || { echo "tag $TAG does not match pyproject.toml's version $PYPROJECT_VERSION"; exit 1; }
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "sde=$(git log -1 --format=%ct -- Dockerfile.projects agentic_os packaging/projects_ui.lock.json packaging/ui-artifacts deploy/assets pyproject.toml hatch_build.py modules.yaml README.md LICENSE LICENSE-COMMONS-CLAUSE LICENSE.md)" >> "$GITHUB_OUTPUT"
          python3 -I -c '
          import json
          d = json.load(open("packaging/projects_ui.lock.json"))
          assert d.get("source_commit_published") is True, "packaging/projects_ui.lock.json: source_commit_published is not true - refusing to publish an image around an unpublished UI source"
          print("UI source commit:", d["source_commit"], "(published)")
          '

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          for t in "$TAG" "${TAG}-${{ steps.vars.outputs.short }}"; do
            if docker buildx imagetools inspect "ghcr.io/redevops-io/${NAME}:${t}" >/dev/null 2>&1; then
              echo "ghcr.io/redevops-io/${NAME}:${t} already exists; tags are never moved"; exit 1
            fi
          done

      - name: Build and push (linux/amd64, linux/arm64; SBOM and max provenance attached by BuildKit)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ env.FILE }}
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_DATE_EPOCH=${{ steps.vars.outputs.sde }}
          tags: |
            ghcr.io/redevops-io/${{ env.NAME }}:${{ env.TAG }}
            ghcr.io/redevops-io/${{ env.NAME }}:${{ env.TAG }}-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.title=redevops-projects
            org.opencontainers.image.description=Self-hosted ReDevOps Projects: the Projects UI + API on one origin (built from release/0.6.0 of redevops-io/agentic-os)
            org.opencontainers.image.licenses=AGPL-3.0-or-later WITH Commons-Clause
          annotations: |
            index:org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            index:org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            index:org.opencontainers.image.version=${{ env.TAG }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - name: "Smoke test the pushed digest (amd64): unauthenticated UI shell at /, /api refuses anonymously"
        run: |
          IMG="ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}"
          docker run -d --name smoke -p 127.0.0.1:18787:8787 --read-only --tmpfs /tmp --tmpfs /home/app "$IMG"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18787/ >/dev/null && break; sleep 2; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/projects)" = 401 ]
          docker rm -f smoke >/dev/null

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign by digest (index and every per-architecture manifest)
        run: cosign sign --yes --recursive "ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/redevops-io/${{ env.NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Vulnerability scan report (information for the release record, read by a person)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output "/out/trivy-${NAME}.json" "ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}" || true

      - name: Release record
        run: |
          {
            echo "### ${NAME} ${TAG}"
            echo "- index digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- source: \`${{ steps.vars.outputs.commit }}\` (release/0.6.0)"
            echo "- reference by digest: \`ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-${{ env.NAME }}
          path: trivy-${{ env.NAME }}.json
          if-no-files-found: warn
