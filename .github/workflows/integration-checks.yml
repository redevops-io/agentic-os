# Runs the Support, Billing and Outreach apps against REAL, throwaway instances of Chatwoot, Lago and Twenty, started in Docker on the
# runner and removed again (scripts/integration-checks/run_with_throwaway_core.sh). The app tests in tests.yml use stand-ins for these
# products; this is the evidence that the integrations work against the products themselves, at the versions the script names.
# It runs when one of the three apps or the checks change, and by hand before a release (docs/RELEASING.md). It is not a required check:
# it pulls large third-party images and depends on Docker Hub.
name: integration-checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/support/**"
      - "apps/billing/**"
      - "apps/outreach-engine/**"
      - "scripts/integration-checks/**"
      - ".github/workflows/integration-checks.yml"
permissions:
  contents: read
concurrency:
  group: integration-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.app }} against a real ${{ matrix.core }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {core: chatwoot, app: support}
          - {core: lago, app: billing}
          - {core: twenty, app: outreach-engine}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the kernel and the app's requirements
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r "apps/${{ matrix.app }}/requirements.txt"
      - name: Start a throwaway ${{ matrix.core }}, run the check, remove it
        run: |
          set -o pipefail
          scripts/integration-checks/run_with_throwaway_core.sh "${{ matrix.core }}" | tee "$RUNNER_TEMP/result.txt"
      - name: Every check passed and at least one ran
        run: |
          python - "$RUNNER_TEMP/result.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          passed, failed = len(re.findall(r'"ok": true', text)), len(re.findall(r'"ok": false', text))
          print(f"{passed} passed, {failed} failed")
          sys.exit(0 if passed and not failed else 1)
          PY
      - name: Nothing is left running
        if: always()
        run: test -z "$(docker ps -aq --filter label=ic.run)"
