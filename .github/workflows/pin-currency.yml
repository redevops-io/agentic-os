# Weekly cross-repo pin-currency report. Read-only: uploads the pin matrix as an artifact and
# opens NO pull requests/issues. Fails the run when a security-relevant pin (agentic-os,
# runtime-contracts, mission-sdk) is behind the latest tag, so staleness is visible in Actions.
# Private repos need a read token; set the optional PIN_CHECK_TOKEN secret (read-only PAT),
# otherwise the default GITHUB_TOKEN is used and private repos show as `unreadable`.
name: pin-currency

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      max_behind:
        description: "Allowed releases behind for security pins"
        default: "0"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin matrix
        env:
          GH_TOKEN: ${{ secrets.PIN_CHECK_TOKEN || github.token }}
        run: |
          python3 scripts/check_pin_currency.py \
            --max-behind "${{ inputs.max_behind || '0' }}" \
            --json pin-matrix.json --markdown pin-matrix.md | tee pin-matrix.txt
          cat pin-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-matrix
          path: |
            pin-matrix.txt
            pin-matrix.md
            pin-matrix.json
