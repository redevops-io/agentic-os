# Publishes the standalone image ghcr.io/redevops-io/edge-sentinel from a product release TAG of this repository
# (edge-sentinel-vX.Y.Z, an annotated tag on a commit of main). Manual dispatch only, from the protected branch: a person types the confirmation.
# Same shape as oci-release.yml (pinned actions, keyless signing, provenance, no overwrite), for the one image.
# Consumers verify with:
#   cosign verify ghcr.io/redevops-io/edge-sentinel@sha256:<index digest> \
#     --certificate-identity 'https://github.com/redevops-io/agentic-os/.github/workflows/oci-edge-sentinel.yml@refs/heads/main' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: oci-edge-sentinel
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Product release tag to build, for example edge-sentinel-v0.6.3"
        required: true
      confirm:
        description: "Type exactly: PUBLISH <ref>"
        required: true
permissions:
  contents: read
concurrency:
  group: oci-edge-sentinel
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      NAME: edge-sentinel
      FILE: apps/edge-sentinel/Dockerfile.standalone
      REF: ${{ inputs.ref }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Check the confirmation and the ref
        run: |
          [ "$CONFIRM" = "PUBLISH $REF" ] || { echo "the confirmation does not match: type PUBLISH $REF"; exit 1; }
          case "$REF" in edge-sentinel-v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "ref must be a product release tag like edge-sentinel-v0.6.3"; exit 1;; esac
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "dispatch from the protected branch main only (got $GITHUB_REF)"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/tags/${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build inputs
        id: vars
        run: |
          COMMIT="$(git rev-parse HEAD)"
          # the tag must sit on the main line: the image is built from main, never from the v0.6.x release line
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "tag $REF ($COMMIT) is not on main"; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=${REF#edge-sentinel-v}" >> "$GITHUB_OUTPUT"
          echo "sde=$(git log -1 --format=%ct -- apps/edge-sentinel agentic_os deploy/assets pyproject.toml hatch_build.py modules.yaml README.md LICENSE LICENSE-COMMONS-CLAUSE LICENSE.md)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        run: |
          for t in "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.short }}"; do
            if docker buildx imagetools inspect "ghcr.io/redevops-io/${NAME}:${t}" >/dev/null 2>&1; then
              echo "ghcr.io/redevops-io/${NAME}:${t} already exists; tags are never moved"; exit 1
            fi
          done
      - name: Build and push (linux/amd64, linux/arm64; SBOM and max provenance attached by BuildKit)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ env.FILE }}
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_DATE_EPOCH=${{ steps.vars.outputs.sde }}
          tags: |
            ghcr.io/redevops-io/${{ env.NAME }}:${{ steps.vars.outputs.version }}
            ghcr.io/redevops-io/${{ env.NAME }}:${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.title=edge-sentinel
            org.opencontainers.image.description=Edge Sentinel standalone: SOC dashboard and API over a CrowdSec core (built from the main line of redevops-io/agentic-os, not from the v0.6.x release line)
            org.opencontainers.image.licenses=AGPL-3.0-or-later WITH Commons-Clause
          annotations: |
            index:org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            index:org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            index:org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
      - name: "Smoke test the pushed digest (amd64): refuses to start unconfigured, probes answer, anonymous requests are refused"
        run: |
          IMG="ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}"
          PW="$(openssl rand -hex 16)"
          if docker run --rm "$IMG" >/tmp/noauth.log 2>&1; then echo "the image started without an operator credential"; exit 1; fi
          grep -q "SENTINEL_REQUIRE_AUTH" /tmp/noauth.log
          docker run -d --name smoke -p 127.0.0.1:18203:8203 --read-only --tmpfs /tmp \
            -e SENTINEL_BASIC_AUTH_USER=operator -e SENTINEL_BASIC_AUTH_PASS="$PW" "$IMG"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18203/readyz >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:18203/readyz
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18203/)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u "operator:${PW}" http://127.0.0.1:18203/api/cases)" = 200 ]
          docker rm -f smoke >/dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign by digest (index and every per-architecture manifest)
        run: cosign sign --yes --recursive "ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/redevops-io/${{ env.NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Vulnerability scan report (information for the release record, read by a person)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output "/out/trivy-${NAME}.json" "ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}" || true
      - name: Release record
        run: |
          {
            echo "### ${NAME} ${{ steps.vars.outputs.version }}"
            echo "- index digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- source: \`${{ steps.vars.outputs.commit }}\` (tag ${REF}, on main)"
            echo "- reference by digest: \`ghcr.io/redevops-io/${NAME}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-${{ env.NAME }}
          path: trivy-${{ env.NAME }}.json
          if-no-files-found: warn
