# Compile + test the desktop shell on all three OSes whenever it changes. (native-packaging.yml builds installers, but only on
# `apps-v*` tags — so until now a change to the shell was never built in CI.) No installer, no sidecar build: this proves the
# shell compiles and its tests pass on Linux, Windows and macOS. `--locked` because Cargo.lock is committed on purpose: a
# desktop binary that handles credentials must build reproducibly.
name: desktop-shell

on:
  pull_request:
    paths: ["deploy/launcher/**", ".github/workflows/desktop-shell.yml"]
  push:
    branches: ["main"]
    paths: ["deploy/launcher/**", ".github/workflows/desktop-shell.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: deploy/launcher/src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build deps (WebKitGTK, tray, Secret Service for the keyring crate)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libdbus-1-dev pkg-config patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: deploy/launcher/src-tauri

      # tauri-build insists the externalBin exists for the target triple; a stub is enough to compile and test.
      - name: Stub the sidecar for the host triple
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p binaries
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          printf 'stub' > "binaries/redevops-sidecar-${triple}${ext}"

      - name: "Unit and local-socket tests"
        run: cargo test --locked

      - name: "Build (release-shaped, no test hook)"
        run: cargo build --locked

      - name: "Build with the selftest hook (keeps that configuration compiling)"
        run: cargo build --locked --features selftest
