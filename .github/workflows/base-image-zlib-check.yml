name: base-image-zlib-check

# Reports, once a week, whether the current python:3.12-slim base carries the fixed zlib1g (Debian trixie
# 1:1.3.dfsg+really1.3.1-1+deb13u1, DSA-6613-1: CVE-2026-76844, CVE-2026-85091) that the published v0.6.1 images lack.
# It reads one package version and nothing else: no image is built, tagged or published here. Green = the base is still
# unpatched (nothing to do); red = a patched base exists, so the maintainers decide on a new image tag.
# Record and procedure: docs/release/RESIDUAL_FINDINGS.md on the release line (release/0.6.0).
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zlib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read zlib1g from the current python:3.12-slim
        env:
          FIXED: "1:1.3.dfsg+really1.3.1-1+deb13u1"
        run: |
          set -euo pipefail
          ref=python:3.12-slim
          docker pull -q "$ref" >/dev/null
          digest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')"
          have="$(docker run --rm "$ref" dpkg-query -W -f '${Version}' zlib1g)"
          {
            echo "### python:3.12-slim zlib1g"
            echo "- image: \`$digest\`"
            echo "- zlib1g installed: \`$have\`"
            echo "- fixed in trixie-security: \`$FIXED\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if dpkg --compare-versions "$have" ge "$FIXED"; then
            echo "::error::python:3.12-slim now carries zlib1g $have (>= $FIXED). A patched base is available: record it in docs/release/RESIDUAL_FINDINGS.md and decide on a new image tag. Nothing was rebuilt or published."
            echo "- result: **patched base available**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- result: still unpatched" >> "$GITHUB_STEP_SUMMARY"
          echo "still unpatched: $have"
