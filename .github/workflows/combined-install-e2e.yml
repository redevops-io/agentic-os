name: combined-install-e2e

# The release gate for the combined install claim (deploy/combined). It runs the documented path verbatim:
# bootstrap.sh -> smoke.sh -> teardown, on a clean Linux runner, against the published product images pinned
# in the example .env and a Projects image built from this commit. If this is red, the combined-install
# documentation must not be cited.
on:
  pull_request:
    paths:
      - deploy/combined/**
      - deploy/standalone/edge-sentinel/**
      - agentic_os/products/**
      - agentic_os/projects_api.py
      - Dockerfile.projects
      - .github/workflows/combined-install-e2e.yml
  push:
    branches: [main]
    paths:
      - deploy/combined/**
      - deploy/standalone/edge-sentinel/**
      - agentic_os/products/**
      - agentic_os/projects_api.py
      - Dockerfile.projects
  schedule:
    - cron: '17 4 * * *'   # daily: the published images can move under us
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a pull request drops its superseded runs; every pushed or dispatched commit keeps its own: a later merge never
  # cancels the checks of a commit that is being released
  group: combined-install-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap the combined install (the documented command)
        working-directory: deploy/combined
        run: ./bootstrap.sh
      - name: Smoke the running stack (the documented command)
        working-directory: deploy/combined
        run: ./smoke.sh
      - name: On failure, keep the evidence
        if: failure()
        run: |
          mkdir -p /tmp/evidence
          docker ps -a                       > /tmp/evidence/docker-ps.txt 2>&1 || true
          docker compose -p aos-combined logs --no-color > /tmp/evidence/combined.log 2>&1 || true
          docker compose -p edge-sentinel logs --no-color > /tmp/evidence/sentinel.log 2>&1 || true
          tail -c 200000 /tmp/evidence/*.log || true
      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combined-install-evidence
          path: /tmp/evidence/
      - name: Teardown
        if: always()
        working-directory: deploy/combined
        run: ./smoke.sh --teardown

  # Proves Product B's Edge Sentinel half needs nothing from the combined bundle (Projects, Sidekick,
  # redevops-qa) or from the agentic-os desktop build (neither of which this job's runner ever installs):
  # the documented standalone path, run directly, not through deploy/combined's wrapper. Independent of the
  # `combined` job above - a failure here is specifically "Edge Sentinel alone is broken", not "the bundle is".
  standalone-edge-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap the standalone Edge Sentinel install (the documented command, no other product present)
        working-directory: deploy/standalone/edge-sentinel
        run: ./bootstrap.sh
      - name: Wait for Edge Sentinel's own readiness (bootstrap.sh only waits for CrowdSec's)
        working-directory: deploy/standalone/edge-sentinel
        run: |
          PORT="$(sed -n 's/^EDGE_SENTINEL_PORT=//p' .env 2>/dev/null | tail -1)"; PORT="${PORT:-8203}"
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/health")" = 200 ] && exit 0
            sleep 2
          done
          echo "Edge Sentinel did not answer /health in time"; docker compose logs --no-color edge-sentinel | tail -100; exit 1
      - name: Smoke the running stack (alert -> case -> approve -> execute -> receipt -> restart-persists)
        working-directory: deploy/standalone/edge-sentinel
        run: ./smoke.sh
      - name: On failure, keep the evidence
        if: failure()
        working-directory: deploy/standalone/edge-sentinel
        run: |
          mkdir -p /tmp/evidence-standalone
          docker compose ps -a                        > /tmp/evidence-standalone/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > /tmp/evidence-standalone/sentinel.log 2>&1 || true
          tail -c 200000 /tmp/evidence-standalone/*.log || true
      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-edge-sentinel-evidence
          path: /tmp/evidence-standalone/
      - name: Teardown
        if: always()
        working-directory: deploy/standalone/edge-sentinel
        run: docker compose down -v || true