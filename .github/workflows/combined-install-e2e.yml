name: combined-install-e2e

# The release gate for the combined install claim (deploy/combined). It runs the documented path verbatim:
# bootstrap.sh -> smoke.sh -> teardown, on a clean Linux runner, against the published product images pinned
# in the example .env and a Projects image built from this commit. If this is red, the combined-install
# documentation must not be cited.
on:
  pull_request:
    paths:
      - deploy/combined/**
      - deploy/standalone/edge-sentinel/**
      - agentic_os/products/**
      - agentic_os/projects_api.py
      - Dockerfile.projects
      - .github/workflows/combined-install-e2e.yml
  push:
    branches: [main]
    paths:
      - deploy/combined/**
      - deploy/standalone/edge-sentinel/**
      - agentic_os/products/**
      - agentic_os/projects_api.py
      - Dockerfile.projects
  schedule:
    - cron: '17 4 * * *'   # daily: the published images can move under us
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combined-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap the combined install (the documented command)
        working-directory: deploy/combined
        run: ./bootstrap.sh
      - name: Smoke the running stack (the documented command)
        working-directory: deploy/combined
        run: ./smoke.sh
      - name: TEMP DEBUG - uncensored products.yaml load diagnostic
        if: failure()
        working-directory: deploy/combined
        run: |
          echo "--- docker images ---"
          docker images
          echo "--- uncensored load_registry ---"
          docker run --rm -v "$PWD/products.yaml:/p.yaml:ro" rails-projects:combined \
            python3 -c 'from agentic_os.products.registry import load_registry as l; r=l("/p.yaml"); print("errors:", r.errors); print("products:", [p.id for p in r.products])' || true
          echo "--- pip show / import check ---"
          docker run --rm rails-projects:combined python3 -c "import agentic_os.products, yaml; print(agentic_os.products.__file__); print('yaml', yaml.__version__)" || true
          echo "--- ls inside image ---"
          docker run --rm rails-projects:combined ls -la /app/agentic_os/products/ || true
      - name: On failure, keep the evidence
        if: failure()
        run: |
          mkdir -p /tmp/evidence
          docker ps -a                       > /tmp/evidence/docker-ps.txt 2>&1 || true
          docker compose -p aos-combined logs --no-color > /tmp/evidence/combined.log 2>&1 || true
          docker compose -p edge-sentinel logs --no-color > /tmp/evidence/sentinel.log 2>&1 || true
          tail -c 200000 /tmp/evidence/*.log || true
      - name: Upload the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combined-install-evidence
          path: /tmp/evidence/
      - name: Teardown
        if: always()
        working-directory: deploy/combined
        run: ./smoke.sh --teardown