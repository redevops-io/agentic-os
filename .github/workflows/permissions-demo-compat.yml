name: permissions-demo-compat

# Demo / unattended-run compatibility gate for the permissions plane (docs/PERMISSIONS_MIGRATION.md).
# Starts each demo path with its documented configuration and synthetic data, runs its principal workflow with no human
# in the loop, and asserts both that the intended operation succeeds and that unauthorised operations stay denied.
# Offline: no model endpoint, no Docker, no network service. Authorisation is never relaxed to make a demo pass.
on:
  push:
    branches: [main]
    paths:
      - "agentic_os/permissions*.py"
      - "agentic_os/tool_actions.py"
      - "agentic_os/control_plane.py"
      - "agentic_os/cli.py"
      - "agentic_os/app_gate.py"
      - "deploy/permissions-showcase-demo/**"
      - "tests/test_demo_compatibility.py"
      - "tests/test_permissions_*.py"
      - "tests/test_authorization_bridge*.py"
      - "tests/test_agent_console_authorization.py"
      - "tests/test_classification_single_source.py"
      - "tests/test_dependency_pins.py"
      - "tests/test_sc*.py"
      - "tests/_page_js_harness.js"
      - "apps/*/requirements.txt"
      - ".github/workflows/permissions-demo-compat.yml"
  pull_request:
    # No path filter here: `authorization-seam` is a REQUIRED status check on main, and a required check that only
    # runs for some paths can never be satisfied by a pull request that touches none of them (it stays "expected"
    # forever and the PR cannot merge). It runs on every pull request; pushes to main keep the filter above.

permissions:
  contents: read

# Both jobs below name the harness commit at the install site, which is what the repository's own pin rule
# (SC20 in tests/test_sc03_sc14_build_and_deploy.py) requires and what it checks. The two copies have to
# carry the same value: tests/test_dependency_pins.py asserts the file holds exactly ONE distinct harness
# commit, because the copies are exactly the thing that drifted apart here before.

concurrency:
  # a pull request drops its superseded runs; every pushed or dispatched commit keeps its own: a later merge never
  # cancels the checks of a commit that is being released
  group: permissions-demo-compat-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # None of these is set: the gate proves the documented configuration starts, not a relaxed one.
      # (No approval secret, no key and no development-only opt-in is exported here.)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "Install the kernel, dev extras and the tool-gate harness (pinned to a commit, so a moving dependency cannot weaken this gate)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb]" "agent-harness @ git+https://github.com/redevops-io/agent-harness.git@1259d1b338e80414b32b863bcc97a0db93db8cd2"
      - name: Demo compatibility gate
        run: pytest -q -p no:cacheprovider tests/test_demo_compatibility.py tests/test_deployment_paths.py tests/test_tool_actions_complete.py tests/test_sc*.py
      - name: Permissions regression suites (authorisation, scope, write authorisation, roles/columns, storage, concurrency)
        run: pytest -q -p no:cacheprovider tests/test_permissions_*.py
  # The authorization seam joins three repositories: this kernel's plane, the runtime that installs it as a
  # process default, and the engine that consumes the answer. Before this job no CI job in this repository
  # installed more than one of the three, which is how "an app installs a plane and every granted call is
  # denied" reached a pull request with a green board — the gate that exists to prove permissions still work
  # had never run a single tool call through the engine that consumes them.
  # Each dependency is installed from the commit THIS repository already pins: the harness from the env above,
  # the runtime by reading the app manifest. The job cannot therefore test a different commit than the one the
  # apps ship with, and a pin that moves to a commit predating the seam fails at the import check instead of
  # letting the seam tests skip their way to green.
  authorization-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            apps/support/requirements.txt
      - name: Install the three packages the seam joins, each at its pinned commit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "$(grep '^context-runtime @ ' apps/support/requirements.txt)"
          pip install "agent-harness @ git+https://github.com/redevops-io/agent-harness.git@1259d1b338e80414b32b863bcc97a0db93db8cd2"
          python -c "import agent_harness.tools as t, context_runtime, agentic_os; print('harness :', t.__file__); print('runtime :', context_runtime.__file__); assert hasattr(t, 'engine_authorizer_of'), 'the pinned harness predates engine_authorizer_of, so there is no twin to resolve'; from context_runtime.tools.base import set_default_authorizer; from agentic_os.permissions import make_engine_authorizer; print('both sides of the seam import')"
      - name: The seam, end to end
        shell: bash
        run: |
          set -o pipefail
          pytest -q -p no:cacheprovider -rs tests/test_authorization_bridge_end_to_end.py tests/test_agent_console_authorization.py tests/test_classification_single_source.py tests/test_dependency_pins.py | tee /tmp/seam.log
          if grep -q 'skipped' /tmp/seam.log; then
            echo "::error::a cross-repo seam test skipped: it verified nothing, and this job exists so that nothing here may skip"
            grep 'SKIPPED' /tmp/seam.log | head
            exit 1
          fi