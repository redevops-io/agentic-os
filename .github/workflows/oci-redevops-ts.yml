# Publishes the single-pull bundle ghcr.io/redevops-io/redevops-ts: Projects + Sidekick, redevops-qa and Edge
# Sentinel + CrowdSec, as ONE `docker compose publish --app` OCI artifact. Manual dispatch only, from the
# protected branch: a person types the confirmation. Decoupled from the main agentic-os vX.Y.Z release line and
# from redevops-qa's/edge-sentinel's own release lines — this workflow only builds and tags the ONE extra piece
# the bundle needs (a Projects image under the independent `bundle-*` tag family) and references the two
# published standalone images (ghcr.io/redevops-io/redevops-qa, ghcr.io/redevops-io/edge-sentinel) UNCHANGED, by
# digest. See deploy/combined/compose.bundle.yml's header comment for why the bundle has no file-based secret.
#
# Consumers:
#   git clone https://github.com/redevops-io/agentic-os.git && cd agentic-os/deploy/combined
#   ./bundle-bootstrap.sh          # generates every credential, pulls ghcr.io/redevops-io/redevops-ts:<tag>, wires it up
name: oci-redevops-ts
on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: "Bundle version to publish, for example 0.1.0 (its own version line, independent of agentic-os's vX.Y.Z)"
        required: true
      confirm:
        description: "Type exactly: PUBLISH <bundle_tag>"
        required: true
permissions:
  contents: read
concurrency:
  group: oci-redevops-ts
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.bundle_tag }}
      CONFIRM: ${{ inputs.confirm }}
      QA_IMAGE_TAG: "0.6.6"
      EDGE_SENTINEL_IMAGE_TAG: "0.6.7"
    steps:
      - name: Check the confirmation and the tag
        run: |
          [ "$CONFIRM" = "PUBLISH $TAG" ] || { echo "the confirmation does not match: type PUBLISH $TAG"; exit 1; }
          case "$TAG" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bundle_tag must look like 0.1.0"; exit 1;; esac
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "dispatch from the protected branch main only (got $GITHUB_REF)"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build inputs
        id: vars
        run: |
          COMMIT="$(git rev-parse HEAD)"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short=${COMMIT:0:12}" >> "$GITHUB_OUTPUT"
          echo "sde=$(git log -1 --format=%ct -- Dockerfile.projects pyproject.toml agentic_os deploy/combined)" >> "$GITHUB_OUTPUT"
      # compose publish/-f oci:// behavior was verified against this exact version; the runner's preinstalled
      # plugin is not pinned and may be older or newer.
      - name: Install the Compose CLI plugin pinned to v5.7.0
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v5.7.0/docker-compose-linux-x86_64
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing Projects bundle tag or bundle artifact tag
        run: |
          for ref in "ghcr.io/redevops-io/redevops-projects:bundle-${TAG}" "ghcr.io/redevops-io/redevops-ts:${TAG}"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "$ref already exists; tags are never moved"; exit 1
            fi
          done
      - name: Build and push the Projects image (linux/amd64, linux/arm64; SBOM and max provenance attached by BuildKit)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.projects
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_DATE_EPOCH=${{ steps.vars.outputs.sde }}
          tags: |
            ghcr.io/redevops-io/redevops-projects:bundle-${{ env.TAG }}
            ghcr.io/redevops-io/redevops-projects:bundle-${{ env.TAG }}-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            org.opencontainers.image.version=bundle-${{ env.TAG }}
            org.opencontainers.image.description=Projects/Sidekick, built for the redevops-ts single-pull bundle (not the agentic-os vX.Y.Z release line)
          annotations: |
            index:org.opencontainers.image.source=https://github.com/redevops-io/agentic-os
            index:org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            index:org.opencontainers.image.version=bundle-${{ env.TAG }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the Projects image by digest (index and every per-architecture manifest)
        run: cosign sign --yes --recursive "ghcr.io/redevops-io/redevops-projects@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/redevops-io/redevops-projects
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Vulnerability scan report (information for the release record, read by a person)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output "/out/trivy-redevops-projects.json" "ghcr.io/redevops-io/redevops-projects@${{ steps.build.outputs.digest }}" || true

      # Only unresolved "${VAR}" placeholders and resolved image digests go into the published artifact; nothing
      # below is a real credential (see deploy/combined/compose.bundle.yml's header comment for why).
      - name: Publish the bundle (docker compose publish --app)
        working-directory: deploy/combined
        env:
          PROJECTS_IMAGE: ghcr.io/redevops-io/redevops-projects
          PROJECTS_IMAGE_TAG: bundle-${{ env.TAG }}-${{ steps.vars.outputs.short }}
          # placeholders only: docker compose publish embeds the RAW, unresolved "${VAR:?...}" text for every one
          # of these — never the value below — so any non-empty string satisfies compose's "is this var set"
          # check at publish time without ever reaching the published artifact. Verified against the compose
          # source (internal/publish/publish.go: processFile reads the file as-is; checkEnvironmentVariables'
          # own doc comment: "Interpolated values ... are preserved as placeholders ... and don't leak").
          OPERATOR_BASIC_AUTH: publish-time-placeholder
          SENTINEL_BASIC_AUTH_PASS: publish-time-placeholder
          CROWDSEC_BOUNCER_KEY: publish-time-placeholder
          CROWDSEC_MACHINE_PASSWORD: publish-time-placeholder
          EDGE_SENTINEL_SERVICE_TOKEN: publish-time-placeholder
          QA_SERVICE_TOKEN: publish-time-placeholder
          QA_BOOTSTRAP_ADMIN_PASSWORD: publish-time-placeholder
          APPROVAL_SECRET: publish-time-placeholder
        run: |
          docker compose -f compose.bundle.yml publish --app --resolve-image-digests -y "ghcr.io/redevops-io/redevops-ts:${TAG}"

      - name: Smoke test — pull the JUST-published artifact fresh and run the real consumer path (bundle-bootstrap.sh)
        working-directory: deploy/combined
        run: |
          sed "s/^PROJECTS_IMAGE_TAG=.*/PROJECTS_IMAGE_TAG=bundle-${TAG}-${{ steps.vars.outputs.short }}/; s/^BUNDLE_TAG=.*/BUNDLE_TAG=${TAG}/" \
            .env.bundle.example > .env.bundle
          echo "PROJECTS_IMAGE=ghcr.io/redevops-io/redevops-projects" >> .env.bundle
          ./bundle-bootstrap.sh
          docker compose -f "oci://ghcr.io/redevops-io/redevops-ts:${TAG}" --project-directory . --env-file .env.bundle down -v

      - name: Release record
        run: |
          {
            echo "### redevops-ts ${TAG}"
            echo "- Projects image digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- source: \`${{ steps.vars.outputs.commit }}\`"
            echo "- pull: \`docker compose -f oci://ghcr.io/redevops-io/redevops-ts:${TAG} --project-directory . --env-file .env.bundle up -d -y\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-redevops-projects-bundle
          path: trivy-redevops-projects.json
          if-no-files-found: warn
