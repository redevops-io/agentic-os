# Proves the Linux upgrade path actually works: build+install version N, write real user state, build a
# synthetic N+1 from the SAME checkout (version bump only, never committed), install it OVER the N install
# (dpkg -i, not a purge-and-reinstall), then verify the control plane still serves, reports the new version,
# AND the user's state directory (AGENTIC_OS_HOME) survived untouched.
#
# Supersedes the one-off manual trial (commit 2ecfdf28, "TEST ONLY (never merge): bump the launcher to 0.1.2
# so the Linux upgrade path 0.1.1 -> 0.1.2 can be exercised") with a repeatable, maintained version. Expensive
# (two full native builds): workflow_dispatch only, not on every push/PR.
#
# Duplicates native-packaging.yml's Linux build steps inline rather than refactoring that file into a reusable
# workflow - this file never touches native-packaging.yml, so a bug here cannot affect the real release build.
name: native-upgrade-test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
      AGENTIC_OS_HOME: /var/lib/agentic-os-upgrade-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: CPython 3.12.10 (exact; packaging/toolchain.env PYTHON_VERSION)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.12.16"

      - name: Rust toolchain 1.98.1
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7  # branch 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Linux bundle deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf rsync

      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build N (current pinned version, unmodified)
        id: build_n
        run: |
          set -euo pipefail
          python -I packaging/verify-pins.py
          ./packaging/build-wheelhouse.sh
          ./packaging/build-sidecar.sh
          ./packaging/build-notices.sh
          REDEVOPS_LICENSES_DIR="$GITHUB_WORKSPACE/deploy/launcher/src-tauri/licenses" ./packaging/build-sidecar.sh
          ./packaging/stage-sidecar.sh
          MANIFEST_PYTHON=python ./packaging/build-launcher.sh
          DEB_N="$(find deploy/launcher/src-tauri/target/release/bundle -name '*.deb' | head -1)"
          [ -n "$DEB_N" ] || { echo "no .deb produced for N"; exit 1; }
          cp "$DEB_N" /tmp/n.deb
          # So the N+1 build's own `find ... .deb` below can never accidentally match this leftover artifact.
          rm -f "$DEB_N"
          echo "version=$(python3 -I -c 'import json; print(json.load(open("packaging/identity.json"))["r0prime"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Install N, write real user state, confirm it serves
        run: |
          set -euo pipefail
          sudo apt-get install -y /tmp/n.deb || sudo dpkg -i /tmp/n.deb || { sudo apt-get -f install -y; sudo dpkg -i /tmp/n.deb; }
          sudo mkdir -p "$AGENTIC_OS_HOME"
          sudo chown "$(id -u):$(id -g)" "$AGENTIC_OS_HOME"
          echo "upgrade-test-marker-$(date -u +%s)" > "$AGENTIC_OS_HOME/UPGRADE_TEST_MARKER"
          SIDE="$(command -v redevops-sidecar)"
          LOG_N="$(mktemp)"
          "$SIDE" serve >"$LOG_N" 2>&1 &
          PID_N=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/ >/dev/null || { echo "N did not serve"; cat "$LOG_N"; exit 1; }
          kill "$PID_N" 2>/dev/null || true
          wait "$PID_N" 2>/dev/null || true
          echo "N (${{ steps.build_n.outputs.version }}) installed, served, and wrote a real marker under \$AGENTIC_OS_HOME"

      - name: Bump the version pins to a synthetic N+1 (never committed - this checkout is thrown away)
        id: build_n1
        run: |
          set -euo pipefail
          V="${{ steps.build_n.outputs.version }}"
          MAJOR="${V%.*}"; PATCH="${V##*.}"
          V1="${MAJOR}.$((PATCH + 1))"
          echo "bumping $V -> $V1 (test-only, this checkout is never pushed)"
          python3 -I -c "
          import json
          p = json.load(open('packaging/identity.json'))
          p['r0prime']['version'] = '$V1'
          p['r0prime']['bundle_version'] = '$V1'
          json.dump(p, open('packaging/identity.json', 'w'), indent=2)
          "
          sed -i "s/^version = \"$V\"/version = \"$V1\"/" deploy/launcher/src-tauri/Cargo.toml
          sed -i "s/\"version\": \"$V\"/\"version\": \"$V1\"/" deploy/launcher/src-tauri/tauri.conf.json
          # Cargo.lock's entry for this LOCAL (path) crate's own version is reconciled automatically by the
          # next `cargo build`/`cargo tauri build` - --locked only pins EXTERNAL dependency resolution, not
          # this package's own declared version, so no separate `cargo update` is needed here.
          echo "version=$V1" >> "$GITHUB_OUTPUT"

      - name: Build N+1
        run: |
          set -euo pipefail
          ./packaging/build-wheelhouse.sh
          ./packaging/build-sidecar.sh
          ./packaging/build-notices.sh
          REDEVOPS_LICENSES_DIR="$GITHUB_WORKSPACE/deploy/launcher/src-tauri/licenses" ./packaging/build-sidecar.sh
          ./packaging/stage-sidecar.sh
          MANIFEST_PYTHON=python ./packaging/build-launcher.sh
          DEB_N1="$(find deploy/launcher/src-tauri/target/release/bundle -name '*.deb' | head -1)"
          [ -n "$DEB_N1" ] || { echo "no .deb produced for N+1"; exit 1; }
          cp "$DEB_N1" /tmp/n1.deb

      - name: Install N+1 OVER the N install (the real upgrade path, not a purge-and-reinstall)
        run: |
          set -euo pipefail
          BEFORE="$(cat "$AGENTIC_OS_HOME/UPGRADE_TEST_MARKER")"
          sudo apt-get install -y /tmp/n1.deb || sudo dpkg -i /tmp/n1.deb || { sudo apt-get -f install -y; sudo dpkg -i /tmp/n1.deb; }
          AFTER="$(cat "$AGENTIC_OS_HOME/UPGRADE_TEST_MARKER")"
          [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: the upgrade install touched \$AGENTIC_OS_HOME's state (before: $BEFORE, after: $AFTER)"; exit 1; }
          echo "PASS: user state under \$AGENTIC_OS_HOME survived the upgrade untouched"
          SIDE="$(command -v redevops-sidecar)"
          LOG_N1="$(mktemp)"
          "$SIDE" serve >"$LOG_N1" 2>&1 &
          PID_N1=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/ >/dev/null || { echo "N+1 did not serve after upgrade"; cat "$LOG_N1"; exit 1; }
          kill "$PID_N1" 2>/dev/null || true
          wait "$PID_N1" 2>/dev/null || true
          dpkg -l | grep -i agentic || dpkg -l | grep -i redevops
          echo "PASS: ${{ steps.build_n.outputs.version }} -> ${{ steps.build_n1.outputs.version }} upgrade install succeeded and served"

      - name: On failure, keep the logs
        if: failure()
        run: |
          sudo dpkg -l | grep -iE 'agentic|redevops' > /tmp/dpkg-state.txt || true
          sudo journalctl --no-pager -n 500 > /tmp/journal.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: native-upgrade-test-evidence
          path: |
            /tmp/dpkg-state.txt
            /tmp/journal.txt
          if-no-files-found: warn
