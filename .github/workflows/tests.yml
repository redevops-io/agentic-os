name: tests

# Merge gate. The single required check is the `pytest` job: it runs the FULL kernel suite (tests/, which
# includes the N-invariant conformance gate in tests/conformance/), then every app's own suite, then verifies the
# run left the working tree untouched. See docs/CONFORMANCE.md (incl. the `gh api` commands that make `pytest`
# a required status check on main -- that is a repo setting, not something this file can enforce).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the kernel + dev + duckdb extra
        # duckdb: two durable-ledger tests need the optional DuckDB event store; without it they fail.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb]"
      - name: Full kernel suite (tests/, incl. tests/conformance)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps
        run: pytest -q -p no:cacheprovider tests
      - name: Per-app suites
        # One run per app: several apps share test file basenames (test_operator.py, ...), and each app is its own
        # deployable. (apps/pytest.ini also makes a single `pytest apps` work via importlib import mode.)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps
        run: |
          fail=0
          for d in apps/*/; do
            ls "$d" | grep -q '^test_.*\.py$' || continue
            echo "::group::pytest $d"
            pytest -q -p no:cacheprovider "$d" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Tests must not dirty the working tree
        # Guards test hygiene: no test/fixture may rewrite tracked files (e.g. the vendored agentic_os/projects_ui)
        # or leave stray untracked files behind.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || { git status --short; echo "untracked files left by tests"; exit 1; }
