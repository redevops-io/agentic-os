name: tests

# Merge gate. The single required check is the `pytest` job: it runs the FULL kernel suite (tests/, which
# includes the N-invariant conformance gate in tests/conformance/), then every app's own suite, then verifies the
# run left the working tree untouched. See docs/CONFORMANCE.md (incl. the `gh api` commands that make `pytest`
# a required status check on main -- that is a repo setting, not something this file can enforce).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the kernel + dev + duckdb + mcp extras
        # duckdb: two durable-ledger tests need the optional DuckDB event store; without it they fail.
        # mcp (fastmcp): the Agent Gateway's FastMCP transport tests, including the real HTTP server + client test, need it; without it they skip.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb,mcp]"
      - name: Fetch real connector fixtures (public repo) for the normalization tests
        run: git clone --depth 1 https://github.com/redevops-io/redevops-connectors "$RUNNER_TEMP/redevops-connectors"
      - name: Full kernel suite (tests/, incl. tests/conformance)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps
          REDEVOPS_CONNECTORS_FIXTURES: ${{ runner.temp }}/redevops-connectors/fixtures
        run: pytest -q -p no:cacheprovider tests
      - name: The real FastMCP HTTP transport test must run, not skip
        # always() so that its result is visible even when an unrelated test in the full suite above fails
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps
        run: |
          pytest -v -p no:cacheprovider -rs tests/test_agent_gateway_fastmcp_http.py tests/test_agent_gateway_fastmcp.py | tee "$RUNNER_TEMP/fastmcp.out"
          if grep -q "SKIPPED" "$RUNNER_TEMP/fastmcp.out"; then echo "::error::a FastMCP transport test was skipped (is the mcp extra installed?)"; exit 1; fi
      - name: Per-app suites
        # One run per app: several apps share test file basenames (test_operator.py, ...), and each app is its own
        # deployable. (apps/pytest.ini also makes a single `pytest apps` work via importlib import mode.)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps
        run: |
          fail=0
          for d in apps/*/; do
            ls "$d" | grep -q '^test_.*\.py$' || continue
            echo "::group::pytest $d"
            pytest -q -p no:cacheprovider "$d" && rc=0 || rc=$?
            # exit 5 = "no tests collected": an import-level skip (e.g. video-ad needs the external `reel`
            # package) is not a failure; any other non-zero exit is.
            [ "$rc" -eq 0 ] || [ "$rc" -eq 5 ] || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Tests must not dirty the working tree
        # Guards test hygiene: no test/fixture may rewrite tracked files (e.g. the vendored agentic_os/projects_ui)
        # or leave stray untracked files behind.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)" || { git status --short; echo "untracked files left by tests"; exit 1; }
