# Real Windows ARM64 code-signing for Agentic Apps R0-prime (Microsoft Store S-A readiness), using the
# repository's own documented, reviewed procedure: packaging/signing/SIGNING-PROCEDURE-R0PRIME.md.
#
# This workflow performs REAL, consequential Authenticode signing against a live Azure Trusted Signing
# (Public Trust) certificate under the company's legal identity. It is workflow_dispatch only — never
# on push or pull_request — and the signing jobs run under the `windows-signing` GitHub Environment,
# whose OIDC federated credential is scoped exactly to this repo + this environment (no stored secret
# exists anywhere; azure/login authenticates via short-lived federated tokens only).
#
# Shape (packaging/signing/SIGNING-PROCEDURE-R0PRIME.md section 6): two rounds, because the installer
# containers must be rebuilt after the inner executables (launcher, sidecar, NSIS uninstaller) are signed.
#   collect (windows-11-arm)      -> build unsigned (native ARM64 host triple), capture inner-file requests
#   sign-inner (macos-14, Azure)  -> Authenticode-sign the inner files with sign_windows_r0prime_v3.sh --real
#   apply-and-sign-container       -> rebuild the installers with the signed inner files substituted in,
#     (windows-11-arm then macos-14) then sign the two installer containers the same way
#
# distribution=no throughout: this authorizes a signed CANDIDATE, not a distribution build. It does not
# invoke --distribution and does not claim the distribution-blocking legal decisions are resolved.
#
# Same source tree, same product version (0.1.5) as windows-signing-r0prime.yml — this is a second
# ARCHITECTURE of the same release, not a separate version. The two Windows jobs run on windows-11-arm
# (confirmed real, native ARM64-based PC, usable on this public repo at no extra cost) instead of
# windows-2022, with no other change needed for the build itself — it has no explicit --target; it
# already builds for the runner's own host triple (packaging/stage-sidecar.sh already names the
# sidecar by `rustc -Vv`'s host triple), so collect naturally produces an aarch64-pc-windows-msvc build
# simply by running on this runner. The MSI/NSIS output filenames are discovered by glob rather than
# assumed, since this file does not take Tauri's "arm64" bundler-arch moniker on faith.
#
# This workflow was developed on `main` (its BUILD_COMMIT chain descends from
# windows-signing-r0prime.yml's own fc254a34610dcd84b4cd10147299c7d12fca4119) but the `windows-signing`
# GitHub Environment's deployment-branch-policy only allow-lists `release/0.6.0` — dispatching from
# `main` let `collect` run (confirmed real run 44953980304 passed collect end-to-end for the first
# time) but `sign-inner` was rejected ("Branch main is not allowed to deploy to windows-signing due to
# environment protection rules"). Rather than widen that policy (a real security-relevant change to
# what can trigger a live Azure Trusted Signing call under the company's legal identity), the owner
# chose to port this workflow + its fix chain onto release/0.6.0 instead, matching where
# windows-signing-r0prime.yml itself already lives and is already allow-listed.
#
# BUILD_COMMIT's underlying content is the five-commit packaging fix chain (originally 04db1b26 ->
# 16fa5b08 -> 956b5b74 -> ca635497 -> 51d7717c on main, cherry-picked here verbatim as 3afb0153 ->
# 3d1aa2cd -> 9b176eab -> 9de03f55 -> 6e8874ae onto release/0.6.0's own tip,
# 9a0abd2904454501060d1a921b6c7f25de299dfb — the port was a clean cherry-pick with zero conflicts,
# confirmed beforehand because all six touched files were byte-identical between fc254a34 and that
# release/0.6.0 tip) plus one more child commit fixing two release/0.6.0-only test failures this
# port's own CI surfaced: build-wheelhouse.sh's CRYPTO_HASH capture never went through strip_cr (a
# real latent bug - a trailing \r could corrupt the hash written into the lock file on Windows),
# caught by tests/test_windows_build_prep.py; the other failure (test_workflow_no_publish.py's
# OIDC_SIGNING_WORKFLOWS carve-out) is a non-frozen test-file change, committed separately, not part
# of this BUILD_COMMIT's packaging-tree claim.
#
# BUILD_COMMIT here (9641eed3) is PR #735's squash-merge commit on release/0.6.0, NOT the chain's own
# leaf commit (495773433928) — squash-merging #735 with --delete-branch made that leaf and every
# other commit in the chain unreachable from any ref (confirmed still fetchable by exact SHA right
# after the merge, but relying on an unreachable object is fragile: GitHub does eventually garbage-
# collect objects with no reachable ref, with no guaranteed grace period). The squash commit's tree
# is byte-identical to the chain leaf's tree (confirmed: `git diff <leaf>..9641eed3` is empty), so
# this repoint changes which commit SHA the checkout pins to, not what it checks out. Confirm:
# `git diff --stat 9a0abd29...9641eed3` shows packaging/common.sh, packaging/build-wheelhouse.sh,
# packaging/build-sidecar.sh, packaging/build-notices.sh, packaging/sbom/generate_sbom.py,
# packaging/sbom/analyze.py, tests/test_workflow_no_publish.py, and this workflow file itself —
# nothing else. The product tree is release/0.6.0's own, same as
# windows-signing-r0prime.yml; the only differences from it are how the packaging scripts source ONE
# third-party dependency on this one platform (see the carve-out comment in build-wheelhouse.sh), one
# diagnostic print in the SBOM generator, and one regex fix in the SBOM analyzer (below). This was a
# deliberate, discussed exception to "exact same BUILD_COMMIT": PyPI stopped publishing win_arm64
# wheels for cryptography after 46.0.3, and this repo's pin (50.0.1) has none, so the unmodified
# packaging scripts cannot succeed on this architecture no matter what the environment provides —
# fixing it requires script changes, which a frozen commit cannot carry.
#
# Real run 44969036093 (BUILD_COMMIT=9641eed3, release/0.6.0) got all the way through collect,
# sign-inner (the first real Azure Trusted Signing call on ARM64 inner files - launcher, sidecar,
# uninstaller - succeeded) and apply-and-rebuild, then died in the VERY LAST job, sign-container:
# "ERROR: file name not allowed: Agentic Apps R0-prime_0.1.1_arm64_en-US.msi". packaging/signing/
# sign_windows_r0prime_v3.sh's role_of() file-name allowlist was written when only the x64 build
# existed - MSI_NAME/NSIS_NAME hardcode "_x64_"/"_x64-setup.exe", so the ARM64 build's real container
# names were refused outright, before any signing call for them was even attempted. BUILD_COMMIT here
# (a911396c) adds a new child commit defining MSI_NAME_ARM64/NSIS_NAME_ARM64 (same product/version,
# "_arm64_" instead of "_x64_") and accepting either in role_of() - two more specific, fully-qualified
# names, nothing loosened, nothing else changed in that script. Verified via its own existing test
# suite (test_release_signing_package.py, test_signing_procedure_r0prime.py, test_scopefix.py - 262
# passed, 2 skipped, no regressions).
#
# Re-dispatching on that fix (run 44976518820) got past role_of() but died one check later in the same
# step: "ERROR: ...arm64_en-US.msi could not be inspected for existing signatures (ERR:TypeError)".
# Downloaded the real built MSI from that run's round2-containers artifact and reproduced locally:
# signify==0.9.3's SignedMsiFile import silently fails (caught by the script's own
# `except ImportError: SignedMsiFile = None`) because signify's MSI support needs the `olefile`
# package (OLE2/Compound File Binary parsing - MSI's own container format) and this workflow's "venv-v"
# tool venv only ever installed signify, never olefile - windows-signing-r0prime.yml (the x64 pipeline)
# already installs `"signify==0.9.3" "olefile==0.47"` together in its own equivalent step; this ARM64
# workflow was missing the second package. Not architecture-specific at all - confirmed by reproducing
# with olefile installed: the same MSI then correctly raises AuthenticodeNotSignedError (0 existing
# signatures), exactly what the script's own logic expects for an unsigned input. Fixed by adding
# "olefile==0.47" to both `pip install` lines below, matching the x64 workflow exactly. Pure
# workflow-file fix - no packaging/ change, so BUILD_COMMIT is unchanged.
#   fc254a34 -> 04db1b26  adds the ARCH-gated cryptography-from-sdist branch (the actual fix)
#            -> 16fa5b08  corrects ARCH's own detection: 04db1b26 read PROCESSOR_ARCHITECTURE from
#                          git-bash, but git-bash.exe is itself an x86-64 binary that runs under
#                          Windows' x64-on-arm64 emulation on this runner, so that variable reported
#                          the EMULATED process's own architecture (AMD64), not the real host — the
#                          04db1b26 branch silently never fired (run 44926089086 failed identically to
#                          the pre-fix run). 16fa5b08 reads RUNNER_ARCH instead (set by the Actions
#                          runner itself before launching any shell; confirmed correct from bash via a
#                          disposable probe, closed PR #727).
#            -> 956b5b74  build-wheelhouse.sh's corrected cryptography hash was written to a $TMP file
#                          only IT could see; build-sidecar.sh and build-notices.sh independently
#                          reinstall the same locks/requirements-windows.lock, hardcoded, in later
#                          `run:` steps of the same job (separate script invocations) — real run
#                          44933496336 got past Task 1 on this fix but failed identically at Task 2's
#                          own hash check. 956b5b74 moves the override into the wheelhouse directory
#                          itself (wiped and rewritten every build-wheelhouse.sh run) behind a new
#                          common.sh::effective_lock() helper, used by all three scripts now.
#            -> ca635497  real run 44940597853 got past Task 1 and Task 2 on 956b5b74, then failed at
#                          Task 3 (licence notices from the SBOM): generate_sbom.py already treats any
#                          unattributed archive entry as a hard failure (exit 1), but the entry names
#                          only ever reached archive-attribution.json inside packaging/dist/sbom-pass1,
#                          which a failed collect job never uploads (upload happens after this step) —
#                          the log showed only "unattributed: 2" with no way to tell what. ca635497
#                          prints each unattributed/problem entry to stdout so the next run's log names
#                          them directly; no change to the pass/fail decision itself.
#
# Re-dispatching on ca635497 (run 44943561112) named the two entries: pkg:libcrypto-3-arm64.dll and
# pkg:libssl-3-arm64.dll. First hypothesis (WRONG, but worth fixing anyway): the vcpkg
# "openssl:arm64-windows" triplet used below was DYNAMIC - only import libs for those DLLs, so
# OPENSSL_STATIC=1 against it didn't achieve true static linking. Switched to vcpkg's
# "arm64-windows-static-md" triplet (true static libs, dynamic CRT - the same combination cryptography's
# own official win_amd64/win32 wheels use for static OpenSSL), confirmed present as a built-in triplet
# via a disposable probe (closed PR #731). Re-dispatching on that fix (run 44950224552) failed Task 3
# AGAIN with the exact same two entries - so the triplet switch (kept; it's a real improvement to
# cryptography's own linkage either way) was never the actual cause.
#
# A non-blocking inline diagnostic step added for that same run proved it conclusively: the built
# cryptography wheel's own .pyd has a CLEAN PE import table (no libcrypto/libssl at all - static
# linking genuinely works now), and vcpkg's static-md triplet installed true static .lib files with no
# bin/ DLLs. The two unattributed DLLs have NOTHING to do with cryptography or vcpkg - they're CPython's
# own ARM64 Windows distribution's libcrypto-3-arm64.dll / libssl-3-arm64.dll, shipped in its DLLs/
# folder for the stdlib's _ssl/_hashlib, bundled by PyInstaller the same way the x64 build bundles the
# non-suffixed libcrypto-3.dll / libssl-3.dll for the exact same reason. packaging/sbom/analyze.py's
# component-classification regex for OpenSSL library files only ever allowed an "-x64" architecture
# suffix, never "-arm64", so these two legitimate, already-handled-on-x64 files fell through to
# "unattributed" purely because of their filename suffix. 51d7717c (6e8874ae once cherry-picked onto
# release/0.6.0) is a one-character-class fix: (-x64)? -> (-x64|-arm64)?. The vcpkg triplet fix stays
# in this workflow file as before.
name: windows-signing-r0prime-arm64

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type EXACTLY: sign arm64 c40c5619280642c8c9f8289f0322feb6ca9572b3'
        required: true

permissions:
  contents: read

env:
  BUILD_COMMIT: c40c5619280642c8c9f8289f0322feb6ca9572b3
  PRODUCT_SLUG: "Agentic Apps R0-prime_0.1.5"

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm the exact commit phrase was typed
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "sign arm64 c40c5619280642c8c9f8289f0322feb6ca9572b3" ]; then
            echo "::error::confirmation phrase did not match exactly; refusing to proceed"
            exit 1
          fi
      - name: BUILD_COMMIT must actually exist in this repository (sanity, not identity)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - run: |
          if ! git cat-file -e "${BUILD_COMMIT}^{commit}" 2>/dev/null; then
            echo "::error::BUILD_COMMIT ($BUILD_COMMIT) does not exist in this repository"
            exit 1
          fi
          TREE="$(git rev-parse "${BUILD_COMMIT}^{tree}")"
          if [ "${TREE:0:8}" != "01453033" ]; then
            echo "::error::BUILD_COMMIT's tree hash does not start with the expected 01453033 prefix (got $TREE) - refusing"
            exit 1
          fi
          echo "BUILD_COMMIT verified present, tree prefix 01453033 confirmed."

  collect:
    needs: guard
    runs-on: windows-11-arm
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      # Pinned explicitly to BUILD_COMMIT, independent of whatever ref/branch this run was dispatched
      # against - the actual product build is always of this exact commit's tree, never "whatever HEAD
      # happens to be" (release/0.6.0 has since moved forward to add this very workflow file).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: c40c5619280642c8c9f8289f0322feb6ca9572b3
      - name: Confirm the actual checkout landed on BUILD_COMMIT (belt-and-suspenders)
        shell: bash
        run: |
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$BUILD_COMMIT" ]; then
            echo "::error::checked-out HEAD ($GOT) does not equal BUILD_COMMIT ($BUILD_COMMIT)"
            exit 1
          fi

      - name: CPython 3.12.10 (packaging/toolchain.env PYTHON_VERSION)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Install uv (packaging/toolchain.env UV_VERSION)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.12.16"

      - name: Rust toolchain 1.98.1 (packaging/toolchain.env RUST_VERSION)
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7  # branch 1.98.1
        with:
          toolchain: "1.98.1"

      - name: vcpkg openssl:arm64-windows-static-md (cryptography has no win_arm64 wheel on PyPI)
        shell: bash
        run: |
          # arm64-windows (the dynamic triplet) only provides import libs for libssl-3-arm64.dll /
          # libcrypto-3-arm64.dll: OPENSSL_STATIC=1 against that triplet still links a binary that
          # dynamically depends on those two DLLs at runtime - confirmed by run 44943561112, which got
          # this far and then failed Task 3 (licence notices) because those two DLLs end up as real,
          # unattributed archive entries in the built sidecar. arm64-windows-static-md is vcpkg's true
          # static triplet with the dynamic CRT (/MD, matching python3.dll and every other extension
          # module here) - the same combination cryptography's own official win_amd64/win32 wheels use
          # for their statically-linked OpenSSL. Confirmed present as a built-in vcpkg triplet via a
          # disposable probe (closed PR #731) before spending a real dispatch on it.
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:arm64-windows-static-md
          {
            echo "OPENSSL_DIR=$VCPKG_INSTALLATION_ROOT/installed/arm64-windows-static-md"
            echo "OPENSSL_STATIC=1"
          } >> "$GITHUB_ENV"

      - name: Pins are consistent
        shell: bash
        run: python -I packaging/verify-pins.py

      - name: Task 1 - reproducible wheelhouse
        shell: bash
        run: ./packaging/build-wheelhouse.sh

      - name: DIAGNOSTIC - did openssl-sys actually link OpenSSL statically into cryptography?
        shell: bash
        run: |
          # Task 3 has twice failed with unattributed libcrypto-3-arm64.dll / libssl-3-arm64.dll in the
          # built archive, even after switching to vcpkg's arm64-windows-static-md triplet (PR #732).
          # This answers, in this same run, whether cryptography's own .pyd still imports those two DLLs
          # (static linking genuinely failed) or not (something else - e.g. a PyInstaller hook - is
          # pulling them in), so a Task 3 failure doesn't need a third blind round trip.
          set -x
          WH="packaging/wheelhouse"
          WHL="$(ls "$WH"/cryptography-50.0.1-*.whl)"
          echo "wheel: $WHL"
          TMPD="$(mktemp -d)"
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$WHL" "$TMPD"
          find "$TMPD" \( -iname "*.pyd" -o -iname "*.dll" \) -print
          PYD="$(find "$TMPD" -iname "*.pyd" | head -1)"
          python3 -m pip install --quiet pefile
          python3 -c "import pefile, sys; pe = pefile.PE(sys.argv[1]); print('IMPORTS:', [e.dll.decode() for e in getattr(pe, 'DIRECTORY_ENTRY_IMPORT', [])])" "$PYD"
          echo "== vcpkg arm64-windows-static-md installed/lib =="
          ls -la "$VCPKG_INSTALLATION_ROOT/installed/arm64-windows-static-md/lib" 2>&1 || echo "MISSING"
          echo "== vcpkg arm64-windows-static-md installed/bin (should not exist for a true static triplet) =="
          ls -la "$VCPKG_INSTALLATION_ROOT/installed/arm64-windows-static-md/bin" 2>&1 || echo "absent (expected)"
          set +x
        continue-on-error: true

      - name: Task 2 - freeze the Python sidecar (pass 1)
        shell: bash
        run: ./packaging/build-sidecar.sh

      - name: Task 3 - licence notices from the SBOM
        shell: bash
        run: ./packaging/build-notices.sh

      - name: Task 2b - freeze again, embedding the Licenses folder
        shell: bash
        env:
          REDEVOPS_LICENSES_DIR: ${{ github.workspace }}/deploy/launcher/src-tauri/licenses
        run: ./packaging/build-sidecar.sh

      - name: Stage sidecar for Tauri externalBin
        shell: bash
        run: ./packaging/stage-sidecar.sh

      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build the launcher with --no-bundle (keep a pristine unpatched exe)
        shell: bash
        working-directory: deploy/launcher/src-tauri
        run: |
          cargo tauri build --no-bundle -- --locked
          cp target/release/agentic-r0prime.exe target/release/agentic-r0prime.exe.pristine

      - name: Write the signCommand override (handoff helper has no credential)
        shell: bash
        run: |
          # github.workspace on Windows runners resolves with backslashes (e.g. D:\a\agentic-os\agentic-os),
          # which breaks naive embedding into a JSON string literal (\a is not a valid JSON escape).
          WS_FWD=$(printf %s "${{ github.workspace }}" | tr '\\' '/')
          # cmd must be the absolute path to Git Bash, not the bare string "bash": on Windows runners
          # C:\Windows\System32\bash.exe (the WSL launcher stub) shadows Git Bash on PATH, and no WSL
          # distribution is installed, so a bare "bash" cmd fails immediately with
          # "Windows Subsystem for Linux has no installed distributions." before the script ever runs.
          cat > "$RUNNER_TEMP/override.json" <<JSON
          {"bundle":{"windows":{"signCommand":{"cmd":"C:/Program Files/Git/bin/bash.exe","args":["$WS_FWD/packaging/signing/r0prime_win_signcommand.sh","%1"]}}}}
          JSON

      - name: Collect inner files for MSI (round 1, package type msi)
        shell: bash
        working-directory: deploy/launcher/src-tauri
        env:
          R0P_HANDOFF_MODE: collect
          R0P_HANDOFF_DIR: ${{ github.workspace }}/round1
        run: |
          mkdir -p "$R0P_HANDOFF_DIR"
          cp target/release/agentic-r0prime.exe.pristine target/release/agentic-r0prime.exe
          # -v: tauri-bundler logs a signCommand subprocess's own stdout/stderr at debug level only;
          # without it, a real failure inside r0prime_win_signcommand.sh is swallowed and all that
          # surfaces is the generic "failed to run bash" wrapper error.
          cargo tauri bundle -v --bundles msi --config "$(cat "$RUNNER_TEMP/override.json")"

      - name: Collect inner files for NSIS (round 1, package type nsis)
        shell: bash
        working-directory: deploy/launcher/src-tauri
        env:
          R0P_HANDOFF_MODE: collect
          R0P_HANDOFF_DIR: ${{ github.workspace }}/round1
        run: |
          cp target/release/agentic-r0prime.exe.pristine target/release/agentic-r0prime.exe
          cargo tauri bundle -v --bundles nsis --config "$(cat "$RUNNER_TEMP/override.json")"

      - name: Show what was collected (no secrets - these are unsigned files)
        shell: bash
        run: |
          echo "--- requests-inner ---"; ls -la round1/requests-inner || true
          echo "--- REQUESTS.sha256 ---"; cat round1/REQUESTS.sha256 || true
          echo "--- requests-container ---"; ls -la round1/requests-container || true

      - name: Upload round1 (unsigned inner requests + full target/release tree for byte-identical round 2)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: round1-state
          retention-days: 2
          path: |
            round1/requests-inner/**
            round1/REQUESTS.sha256
            deploy/launcher/src-tauri/target/release/agentic-r0prime.exe.pristine
            deploy/launcher/src-tauri/target/release/redevops-sidecar.exe
            deploy/launcher/src-tauri/target/release/licenses/**
            deploy/launcher/src-tauri/target/release/build/**
            deploy/launcher/src-tauri/target/release/resources/**
            deploy/launcher/src-tauri/binaries/**
            deploy/launcher/src-tauri/licenses/**

  sign-inner:
    needs: collect
    runs-on: macos-15
    environment: windows-signing
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: c40c5619280642c8c9f8289f0322feb6ca9572b3

      - name: Download round1 state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: round1-state
          path: round1-dl

      - name: Azure login via OIDC (no stored secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm the signer role is actually held (read-only check, no signing yet)
        run: |
          az role assignment list --assignee-object-id "$(az ad sp show --id "${{ vars.AZURE_CLIENT_ID }}" --query id -o tsv)" \
            --query "[?roleDefinitionName=='Artifact Signing Certificate Profile Signer']" -o table

      - name: Provision tools - JDK (Temurin 21, macOS aarch64, portable layout the script expects)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          mkdir -p "$TOOLS/jdk/x"
          curl -fsSL -o "$RUNNER_TEMP/jdk.tar.gz" \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.5_11.tar.gz"
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$TOOLS/jdk/x"
          ls -d "$TOOLS"/jdk/x/*/Contents/Home
          "$TOOLS"/jdk/x/*/Contents/Home/bin/java -version

      - name: Provision tools - jsign 7.6 jar (hash-pinned)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          mkdir -p "$TOOLS/jsign"
          curl -fsSL -o "$TOOLS/jsign/jsign-7.6.jar" \
            "https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar"
          GOT="$(shasum -a 256 "$TOOLS/jsign/jsign-7.6.jar" | awk '{print $1}')"
          WANT="6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5"
          if [ "$GOT" != "$WANT" ]; then echo "::error::jsign jar sha256 mismatch: got $GOT want $WANT"; exit 1; fi

      # The signing script's own fixed PATH is /usr/bin:/bin:/usr/sbin:/sbin plus --tools-dir only -
      # it does not include wherever this runner's Azure CLI actually lives. Symlinking it into the
      # same tools dir already passed as --tools-dir makes it resolve there too, under the same
      # sha256 pin the scope file already computes (shasum follows the symlink to the real content).
      - name: Provision tools - az CLI symlink into the tools dir
        run: |
          set -euo pipefail
          REAL_AZ="$(command -v az)"
          ln -sf "$REAL_AZ" "$RUNNER_TEMP/tools/az"
          shasum -a 256 "$RUNNER_TEMP/tools/az"

      - name: Provision tools - Python venv with signify (for the script's own post-sign verification)
        run: |
          set -euo pipefail
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv-v"
          "$RUNNER_TEMP/venv-v/bin/pip" install --no-cache-dir "signify==0.9.3" "olefile==0.47"
          "$RUNNER_TEMP/venv-v/bin/python" -I -c "import signify; print(signify.__version__)"

      - name: Build the scope file for stage inner (every value computed live on this runner)
        id: scope
        run: |
          set -euo pipefail
          OUTDIR="$RUNNER_TEMP/out-inner"
          TOOLS="$RUNNER_TEMP/tools"
          PY="$RUNNER_TEMP/venv-v/bin/python"
          JAVA="$(ls -d "$TOOLS"/jdk/x/*/Contents/Home)/bin/java"
          LEDGER="$RUNNER_TEMP/ledger"
          mkdir -p "$RUNNER_TEMP/scope"

          sha() { shasum -a 256 "$1" | awk '{print $1}'; }

          SCRIPT_SHA="$(sha packaging/signing/sign_windows_r0prime_v3.sh)"
          COMMON_SHA="$(sha packaging/signing/signing-common.sh)"
          VERIFIER_SHA="$(sha packaging/signing/verify_signature_v2.py)"
          IDJSON_SHA="$(sha packaging/identity.json)"
          GATE_SHA="$(sha packaging/distribution-gate.json)"
          GATE_TOOL_SHA="$(sha packaging/check-distribution-gate.py)"
          CHECK_ABOUT_SHA="$(sha packaging/notices/check_about.py)"
          GEN_ABOUT_SHA="$(sha packaging/notices/generate_about.py)"
          ABOUT_REC_SHA="$(sha agentic_os/about_record.py)"
          LEGAL_SIGNERS_SHA="$(sha packaging/legal-allowed-signers)"

          # the three (or more) inner files from round1's REQUESTS.sha256, renamed to their expected <role>-<sha>.exe form
          mkdir -p "$RUNNER_TEMP/inner-inputs"
          INPUT_ARGS=()
          HASHES=()
          while read -r hash name; do
            cp "round1-dl/round1/requests-inner/$name" "$RUNNER_TEMP/inner-inputs/$name"
            INPUT_ARGS+=(--input "$RUNNER_TEMP/inner-inputs/$name" --sha256 "$hash")
            HASHES+=("$hash")
          done < round1-dl/round1/REQUESTS.sha256
          echo "input_args<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${INPUT_ARGS[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          SORTED_HASHES="$(printf '%s\n' "${HASHES[@]}" | sort | tr '\n' ',' | sed 's/,$//')"

          AZ_PATH="$(command -v az)"
          AZ_SHA="$(sha "$AZ_PATH")"
          JAVA_SHA="$(sha "$JAVA")"
          PY_SHA="$(sha "$PY")"
          PKGS="$("$PY" -I -c 'import importlib.metadata as m; print("\n".join(sorted("%s==%s" % (d.metadata["Name"].lower(), d.version) for d in m.distributions())))')"
          PKGS_SHA="$(printf '%s\n' "$PKGS" | shasum -a 256 | awk '{print $1}')"
          VENV_ROOT="$(cd "$(dirname "$PY")/.." && pwd -P)"
          PTH_LIST="$(cd "$VENV_ROOT" && find lib -maxdepth 5 -name '*.pth' -type f 2>/dev/null | LC_ALL=C sort | while IFS= read -r pf; do printf '%s %s\n' "$pf" "$(sha "$pf")"; done)"
          PTH_SHA="$(printf '%s\n' "$PTH_LIST" | shasum -a 256 | awk '{print $1}')"

          NOT_BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOT_AFTER="$(date -u -v+2H +%Y-%m-%dT%H:%M:%SZ)"

          cat > "$RUNNER_TEMP/scope/scope-win-inner.txt" <<EOF
          scope_version=3
          not_before=$NOT_BEFORE
          not_after=$NOT_AFTER
          script_sha256=$SCRIPT_SHA
          common_sha256=$COMMON_SHA
          verifier_sha256=$VERIFIER_SHA
          identity_json_sha256=$IDJSON_SHA
          stage=inner
          inputs_sha256=$SORTED_HASHES
          az_endpoint=https://eus.codesigning.azure.net/
          az_account=redevops
          az_profile=redevops-public
          expected_cn=CN=ReDevOps.io LLC
          gate_sha256=$GATE_SHA
          gate_tool_sha256=$GATE_TOOL_SHA
          distribution=no
          evidence_manifest_sha256=$(printf 'ci-run-%s-inner' "${{ github.run_id }}" | shasum -a 256 | awk '{print $1}')
          build_commit=$BUILD_COMMIT
          procedure_commit=$BUILD_COMMIT
          tool_az_sha256=$AZ_SHA
          tool_java_sha256=$JAVA_SHA
          tool_python_sha256=$PY_SHA
          tool_python_packages_sha256=$PKGS_SHA
          tool_python_pth_sha256=$PTH_SHA
          tool_osslsigncode_sha256=none
          container_listing_sha256=none
          check_about_sha256=$CHECK_ABOUT_SHA
          generate_about_sha256=$GEN_ABOUT_SHA
          about_record_sha256=$ABOUT_REC_SHA
          legal_signers_sha256=$LEGAL_SIGNERS_SHA
          EOF
          AUTH_SHA="$(sha "$RUNNER_TEMP/scope/scope-win-inner.txt")"
          echo "auth_sha=$AUTH_SHA" >> "$GITHUB_OUTPUT"
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"
          echo "ledger=$LEDGER" >> "$GITHUB_OUTPUT"
          echo "tools_dir=$TOOLS" >> "$GITHUB_OUTPUT"
          echo "py=$PY" >> "$GITHUB_OUTPUT"

      - name: Plan (dry-run) - sanity check before touching Azure
        run: |
          set -euo pipefail
          INPUT_ARGS=(); while IFS= read -r line; do [ -n "$line" ] && INPUT_ARGS+=("$line"); done <<< "${{ steps.scope.outputs.input_args }}"
          ./packaging/signing/sign_windows_r0prime_v3.sh --stage inner "${INPUT_ARGS[@]}" \
            --outdir "$RUNNER_TEMP/out-inner-plan" --dry-run \
            --tools-dir "${{ steps.scope.outputs.tools_dir }}" --python "${{ steps.scope.outputs.py }}"

      - name: REAL signing - stage inner (this is the live Azure Trusted Signing call)
        env:
          R0P_AZ_ENDPOINT: https://eus.codesigning.azure.net/
          R0P_AZ_ACCOUNT: redevops
          R0P_AZ_PROFILE: redevops-public
          R0P_AZ_EXPECTED_CN: "CN=ReDevOps.io LLC"
          # r0p_fix_path (signing-common.sh) reads this environment variable, not the --tools-dir
          # CLI flag below (that only feeds the script's own direct path construction for jdk/jsign).
          # Without this, PATH is fixed to /usr/bin:/bin:/usr/sbin:/sbin only and `command -v az`
          # can never find the az symlink provisioned into this same directory.
          R0P_TOOLS_DIR: ${{ steps.scope.outputs.tools_dir }}
        run: |
          set -euo pipefail
          INPUT_ARGS=(); while IFS= read -r line; do [ -n "$line" ] && INPUT_ARGS+=("$line"); done <<< "${{ steps.scope.outputs.input_args }}"
          ./packaging/signing/sign_windows_r0prime_v3.sh --stage inner "${INPUT_ARGS[@]}" \
            --outdir "${{ steps.scope.outputs.outdir }}" --real \
            --i-have-owner-authorization "${{ steps.scope.outputs.auth_sha }}" \
            --scope-file "$RUNNER_TEMP/scope/scope-win-inner.txt" \
            --ledger "${{ steps.scope.outputs.ledger }}" \
            --tools-dir "${{ steps.scope.outputs.tools_dir }}" --python "${{ steps.scope.outputs.py }}"

      - name: Show evidence (no secrets - scrubbed by the script itself)
        if: always() && steps.scope.outputs.outdir != ''
        run: |
          cat "${{ steps.scope.outputs.outdir }}/EVIDENCE.txt" 2>/dev/null || cat "${{ steps.scope.outputs.outdir }}/FAILED" 2>/dev/null || true

      - name: Upload signed-inner output
        # steps.scope.outputs.outdir is empty if the scope step itself never ran (e.g. the Azure
        # login step before it failed); without this guard the path below becomes the bare glob
        # "/**", which walks the entire runner filesystem instead of being skipped.
        if: always() && steps.scope.outputs.outdir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: signed-inner
          retention-days: 2
          path: |
            ${{ steps.scope.outputs.outdir }}/**

  apply-and-rebuild:
    needs: sign-inner
    runs-on: windows-11-arm
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: c40c5619280642c8c9f8289f0322feb6ca9572b3

      - name: CPython 3.12.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.12.16"

      - name: Rust toolchain 1.98.1
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7  # branch 1.98.1
        with:
          toolchain: "1.98.1"

      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Download round1 state (byte-identical unsigned build outputs)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: round1-state
          path: round1-dl

      - name: Download signed-inner files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: signed-inner
          path: signed-inner-dl

      - name: Restore round1's unsigned build state into the real build tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/launcher/src-tauri/target/release
          cp -r round1-dl/deploy/launcher/src-tauri/target/release/. deploy/launcher/src-tauri/target/release/
          cp round1-dl/deploy/launcher/src-tauri/target/release/agentic-r0prime.exe.pristine deploy/launcher/src-tauri/target/release/agentic-r0prime.exe
          # Tauri's externalBin resource (tauri.conf.json), staged by packaging/stage-sidecar.sh in
          # the collect job and never re-run here: round 2 must bundle the SAME sidecar binary as
          # round 1, not a freshly re-staged copy (see the upload step's own "byte-identical" naming).
          mkdir -p deploy/launcher/src-tauri/binaries
          cp -r round1-dl/deploy/launcher/src-tauri/binaries/. deploy/launcher/src-tauri/binaries/
          # Tauri's bundle.resources ("licenses/": "Licenses/" in tauri.conf.json), staged at the
          # PROJECT level (not target/release) by packaging/build-notices.sh in the collect job and
          # never re-run here - same "never existed in this job's checkout" problem as binaries/ above.
          mkdir -p deploy/launcher/src-tauri/licenses
          cp -r round1-dl/deploy/launcher/src-tauri/licenses/. deploy/launcher/src-tauri/licenses/

      - name: Build requests + signed-inner folders for the handoff helper's apply mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p round2/signed-inner
          cp round1-dl/round1/REQUESTS.sha256 round2/REQUESTS.sha256
          find signed-inner-dl -name '*.exe' -exec cp {} round2/signed-inner/ \;
          ( cd round2/signed-inner && for f in *.exe; do [ -f "$f" ] && sha256sum --text "$f"; done ) > round2/signed-inner/SHA256SUMS
          cat round2/signed-inner/SHA256SUMS

      - name: Write the signCommand override
        shell: bash
        run: |
          # github.workspace on Windows runners resolves with backslashes (e.g. D:\a\agentic-os\agentic-os),
          # which breaks naive embedding into a JSON string literal (\a is not a valid JSON escape).
          WS_FWD=$(printf %s "${{ github.workspace }}" | tr '\\' '/')
          # cmd must be the absolute path to Git Bash, not the bare string "bash": see the matching
          # comment in the collect job's "Write the signCommand override" step for why.
          cat > "$RUNNER_TEMP/override.json" <<JSON
          {"bundle":{"windows":{"signCommand":{"cmd":"C:/Program Files/Git/bin/bash.exe","args":["$WS_FWD/packaging/signing/r0prime_win_signcommand.sh","%1"]}}}}
          JSON

      - name: Apply + rebuild MSI with signed inner files
        shell: bash
        working-directory: deploy/launcher/src-tauri
        env:
          R0P_HANDOFF_MODE: apply
          R0P_HANDOFF_DIR: ${{ github.workspace }}/round2
          R0P_HANDOFF_REQUESTS: ${{ github.workspace }}/round2/REQUESTS.sha256
          R0P_EXPECT_SIGNER_CN: "ReDevOps.io LLC"
          R0P_EXPECT_ISSUER_SUBSTR: "Microsoft"
        run: |
          cp target/release/agentic-r0prime.exe.pristine target/release/agentic-r0prime.exe
          cargo tauri bundle -v --bundles msi --config "$(cat "$RUNNER_TEMP/override.json")"

      - name: Apply + rebuild NSIS with signed inner files
        shell: bash
        working-directory: deploy/launcher/src-tauri
        env:
          R0P_HANDOFF_MODE: apply
          R0P_HANDOFF_DIR: ${{ github.workspace }}/round2
          R0P_HANDOFF_REQUESTS: ${{ github.workspace }}/round2/REQUESTS.sha256
          R0P_EXPECT_SIGNER_CN: "ReDevOps.io LLC"
          R0P_EXPECT_ISSUER_SUBSTR: "Microsoft"
        run: |
          cp target/release/agentic-r0prime.exe.pristine target/release/agentic-r0prime.exe
          cargo tauri bundle -v --bundles nsis --config "$(cat "$RUNNER_TEMP/override.json")"

      - name: Build the container listing (file list of the rebuilt installers, with sha256)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p round2/listing
          # Discovered by glob, not assumed: this is the first ARM64 run of this pipeline, so this
          # file does not take Tauri's bundler-arch filename moniker (x64/arm64/x86) on faith.
          MSI="$(ls deploy/launcher/src-tauri/target/release/bundle/msi/*.msi)"
          NSIS="$(ls deploy/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe)"
          : > round2/listing/container-listing.txt
          TMPX=$(mktemp -d)
          # msiexec /a validates the Authenticode signature this MSI just received from real
          # Trusted Signing, which triggers a CRL/OCSP revocation check; on this runner the
          # network path to that check can black-hole instead of failing fast, hanging msiexec
          # for hours (observed: killed only by the 6h job timeout, orphaned msiexec process).
          # Disable WinTrust's publisher/revocation check for this process tree (does not touch
          # the signing scripts' own signature verification) and hard-cap the call so a stall
          # can never again consume the whole job. MSYS_NO_PATHCONV stops Git Bash's automatic
          # path conversion from mangling bare /flag arguments (reg.exe's /v /t /d /f, msiexec's
          # own /a /qn) into bogus Windows drive paths before they ever reach the native tool -
          # the likely real cause of the hang this is meant to fix, since we already build every
          # actual Windows path ourselves via cygpath -w.
          export MSYS_NO_PATHCONV=1
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\WinTrust\Trust Providers\Software Publishing" /v State /t REG_DWORD /d 0x023c00 /f
          timeout 180 msiexec /a "$(cygpath -w "$MSI")" /qn TARGETDIR="$(cygpath -w "$TMPX/msi-extract")" || true
          find "$TMPX/msi-extract" -type f | while read -r f; do sha256sum --text "$f" >> round2/listing/container-listing.txt; done
          sha256sum --text "$MSI" >> round2/listing/container-listing.txt
          sha256sum --text "$NSIS" >> round2/listing/container-listing.txt
          cat round2/listing/container-listing.txt

      - name: Upload rebuilt containers + licenses dir + listing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: round2-containers
          retention-days: 2
          path: |
            deploy/launcher/src-tauri/target/release/bundle/msi/*.msi
            deploy/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
            deploy/launcher/src-tauri/licenses/**
            round2/listing/container-listing.txt

  sign-container:
    needs: apply-and-rebuild
    runs-on: macos-15
    environment: windows-signing
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: c40c5619280642c8c9f8289f0322feb6ca9572b3

      - name: Download round2 containers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: round2-containers
          path: round2-dl

      - name: Azure login via OIDC (no stored secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision tools (same pins as sign-inner)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          mkdir -p "$TOOLS/jdk/x" "$TOOLS/jsign"
          curl -fsSL -o "$RUNNER_TEMP/jdk.tar.gz" \
            "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.5_11.tar.gz"
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$TOOLS/jdk/x"
          curl -fsSL -o "$TOOLS/jsign/jsign-7.6.jar" \
            "https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar"
          GOT="$(shasum -a 256 "$TOOLS/jsign/jsign-7.6.jar" | awk '{print $1}')"
          [ "$GOT" = "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5" ] || { echo "::error::jsign hash mismatch"; exit 1; }
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv-v"
          "$RUNNER_TEMP/venv-v/bin/pip" install --no-cache-dir "signify==0.9.3" "olefile==0.47"
          # same reasoning as sign-inner's own step: the signing script's fixed PATH does not include
          # wherever this runner's az actually lives, only /usr/bin:/bin:/usr/sbin:/sbin + --tools-dir.
          ln -sf "$(command -v az)" "$TOOLS/az"
          shasum -a 256 "$TOOLS/az"

      - name: Build the scope file for stage container
        id: scope
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          PY="$RUNNER_TEMP/venv-v/bin/python"
          JAVA="$(ls -d "$TOOLS"/jdk/x/*/Contents/Home)/bin/java"
          sha() { shasum -a 256 "$1" | awk '{print $1}'; }

          # Discovered by glob, not assumed: see the matching comment in apply-and-rebuild's
          # container-listing step for why this file does not hardcode a bundler-arch moniker.
          MSI="$(ls round2-dl/deploy/launcher/src-tauri/target/release/bundle/msi/*.msi)"
          NSIS="$(ls round2-dl/deploy/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe)"
          MSI_NAME="$(basename "$MSI")"
          NSIS_NAME="$(basename "$NSIS")"
          mkdir -p "$RUNNER_TEMP/container-inputs"
          cp "$MSI" "$RUNNER_TEMP/container-inputs/$MSI_NAME"
          cp "$NSIS" "$RUNNER_TEMP/container-inputs/$NSIS_NAME"
          MSI_SHA="$(sha "$RUNNER_TEMP/container-inputs/$MSI_NAME")"
          NSIS_SHA="$(sha "$RUNNER_TEMP/container-inputs/$NSIS_NAME")"
          SORTED_HASHES="$(printf '%s\n%s\n' "$MSI_SHA" "$NSIS_SHA" | sort | tr '\n' ',' | sed 's/,$//')"
          # One argument per line (PRODUCT_SLUG/filenames contain spaces), read back into a bash
          # array in the REAL signing step, same as stage inner.
          echo "input_args<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            --input "$RUNNER_TEMP/container-inputs/$MSI_NAME" --sha256 "$MSI_SHA" \
            --input "$RUNNER_TEMP/container-inputs/$NSIS_NAME" --sha256 "$NSIS_SHA" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          LISTING_SHA="$(sha round2-dl/round2/listing/container-listing.txt)"

          AZ_PATH="$(command -v az)"
          AZ_SHA="$(sha "$AZ_PATH")"; JAVA_SHA="$(sha "$JAVA")"; PY_SHA="$(sha "$PY")"
          PKGS="$("$PY" -I -c 'import importlib.metadata as m; print("\n".join(sorted("%s==%s" % (d.metadata["Name"].lower(), d.version) for d in m.distributions())))')"
          PKGS_SHA="$(printf '%s\n' "$PKGS" | shasum -a 256 | awk '{print $1}')"
          VENV_ROOT="$(cd "$(dirname "$PY")/.." && pwd -P)"
          PTH_LIST="$(cd "$VENV_ROOT" && find lib -maxdepth 5 -name '*.pth' -type f 2>/dev/null | LC_ALL=C sort | while IFS= read -r pf; do printf '%s %s\n' "$pf" "$(sha "$pf")"; done)"
          PTH_SHA="$(printf '%s\n' "$PTH_LIST" | shasum -a 256 | awk '{print $1}')"

          NOT_BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOT_AFTER="$(date -u -v+2H +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$RUNNER_TEMP/scope"
          cat > "$RUNNER_TEMP/scope/scope-win-container.txt" <<EOF
          scope_version=3
          not_before=$NOT_BEFORE
          not_after=$NOT_AFTER
          script_sha256=$(sha packaging/signing/sign_windows_r0prime_v3.sh)
          common_sha256=$(sha packaging/signing/signing-common.sh)
          verifier_sha256=$(sha packaging/signing/verify_signature_v2.py)
          identity_json_sha256=$(sha packaging/identity.json)
          stage=container
          inputs_sha256=$SORTED_HASHES
          az_endpoint=https://eus.codesigning.azure.net/
          az_account=redevops
          az_profile=redevops-public
          expected_cn=CN=ReDevOps.io LLC
          gate_sha256=$(sha packaging/distribution-gate.json)
          gate_tool_sha256=$(sha packaging/check-distribution-gate.py)
          distribution=no
          evidence_manifest_sha256=$(printf 'ci-run-%s-container' "${{ github.run_id }}" | shasum -a 256 | awk '{print $1}')
          build_commit=$BUILD_COMMIT
          procedure_commit=$BUILD_COMMIT
          tool_az_sha256=$AZ_SHA
          tool_java_sha256=$JAVA_SHA
          tool_python_sha256=$PY_SHA
          tool_python_packages_sha256=$PKGS_SHA
          tool_python_pth_sha256=$PTH_SHA
          tool_osslsigncode_sha256=none
          container_listing_sha256=$LISTING_SHA
          check_about_sha256=$(sha packaging/notices/check_about.py)
          generate_about_sha256=$(sha packaging/notices/generate_about.py)
          about_record_sha256=$(sha agentic_os/about_record.py)
          legal_signers_sha256=$(sha packaging/legal-allowed-signers)
          EOF
          echo "auth_sha=$(sha "$RUNNER_TEMP/scope/scope-win-container.txt")" >> "$GITHUB_OUTPUT"
          echo "outdir=$RUNNER_TEMP/out-container" >> "$GITHUB_OUTPUT"
          echo "ledger=$RUNNER_TEMP/ledger" >> "$GITHUB_OUTPUT"
          echo "tools_dir=$TOOLS" >> "$GITHUB_OUTPUT"
          echo "py=$PY" >> "$GITHUB_OUTPUT"
          echo "listing=round2-dl/round2/listing/container-listing.txt" >> "$GITHUB_OUTPUT"

      - name: REAL signing - stage container (live Azure Trusted Signing call)
        env:
          R0P_AZ_ENDPOINT: https://eus.codesigning.azure.net/
          R0P_AZ_ACCOUNT: redevops
          R0P_AZ_PROFILE: redevops-public
          R0P_AZ_EXPECTED_CN: "CN=ReDevOps.io LLC"
          # see the matching comment on sign-inner's own "REAL signing" step: r0p_fix_path
          # (signing-common.sh) reads this environment variable, not the --tools-dir CLI flag.
          R0P_TOOLS_DIR: ${{ steps.scope.outputs.tools_dir }}
        run: |
          set -euo pipefail
          INPUT_ARGS=(); while IFS= read -r line; do [ -n "$line" ] && INPUT_ARGS+=("$line"); done <<< "${{ steps.scope.outputs.input_args }}"
          ./packaging/signing/sign_windows_r0prime_v3.sh --stage container "${INPUT_ARGS[@]}" \
            --outdir "${{ steps.scope.outputs.outdir }}" --real \
            --i-have-owner-authorization "${{ steps.scope.outputs.auth_sha }}" \
            --scope-file "$RUNNER_TEMP/scope/scope-win-container.txt" \
            --ledger "${{ steps.scope.outputs.ledger }}" \
            --tools-dir "${{ steps.scope.outputs.tools_dir }}" --python "${{ steps.scope.outputs.py }}" \
            --container-listing "${{ steps.scope.outputs.listing }}" \
            --licenses-dir round2-dl/deploy/launcher/src-tauri/licenses

      - name: Show evidence
        if: always() && steps.scope.outputs.outdir != ''
        run: |
          cat "${{ steps.scope.outputs.outdir }}/EVIDENCE.txt" 2>/dev/null || cat "${{ steps.scope.outputs.outdir }}/FAILED" 2>/dev/null || true
          cat "${{ steps.scope.outputs.outdir }}/SHA256SUMS" 2>/dev/null || true

      - name: Upload final signed installers + evidence
        # see the matching comment on sign-inner's "Upload signed-inner output" step
        if: always() && steps.scope.outputs.outdir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: signed-containers-final
          retention-days: 14
          path: |
            ${{ steps.scope.outputs.outdir }}/**
