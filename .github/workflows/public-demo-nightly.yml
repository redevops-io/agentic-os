name: public-demo-nightly

# Live availability and response-contract check for the intentionally public demo surfaces
# (audit/public_demo_contract.json, owner clarification 2026-11-08). ANONYMOUS GET/HEAD ONLY — the job never
# sends POST/PUT/PATCH/DELETE at a hosted demo. Stdlib only.
#
# Why read-only is a hard constraint here: to prove a privileged write route is refused, a probe has to send
# the request that route refuses. If the guard had regressed, the probe would itself have performed the
# mutation — on a hosted demo, from an unattended schedule. Write refusal is proven offline against the repo's
# own apps (tests/test_public_demo_contract.py::test_protected_operation_refused_anonymous_local), which also
# checks that the refusal changed no state.
#
# This job never validates functionality — that is what the PR checks do offline. Its job is the hosted
# surface: if a documented public page stops answering, or a privileged route starts answering anonymously,
# this goes red.
on:
  schedule:
    - cron: "23 5 * * *"   # daily 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runs FIRST, offline, and decides whether this job may touch the network at all: it asserts every
      # request the live steps can issue is GET/HEAD (the live probe set is filtered in the test module, and
      # the script's own requests are captured and inspected). If it goes red, nothing below reaches a demo.
      - name: Prove this job cannot send a mutating request
        run: python -m pytest -q tests/test_public_demo_contract.py -k "not live"
      - name: Probe the hosted demo against its pinned contract
        run: python scripts/probe_public_demo.py
      - name: Run the contract's own live checks (anonymous reads only; the same tests CI skips offline)
        env:
          DEMO_BASE_URL: https://demo.redevops.io
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q tests/test_public_demo_contract.py -k live
