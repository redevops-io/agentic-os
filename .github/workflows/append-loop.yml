name: append-loop (temporary diagnostic)
on:
  push:
    branches: [fix-windows-append-writers]
permissions:
  contents: read
jobs:
  loop:
    name: ${{ matrix.which }} writers (${{ matrix.load }})
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        which: [new]
        load: [idle, loaded]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: { path: new }
      - uses: actions/checkout@v4
        with: { path: old, ref: 8c751cf389135d2c5fa06acc0e00dc1cacc1dbfe }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0" "cryptography>=42" "pyyaml>=6.0" "runtime-contracts @ git+https://github.com/redevops-io/runtime-contracts.git@v0.3.14"
      - name: start CPU load
        if: matrix.load == 'loaded'
        shell: bash
        run: |
          for i in 1 2 3 4; do (python -c "while True: pass" &) ; done
      - name: run the writer tests 15 times against the ${{ matrix.which }} writers (all tests every time, tally per test)
        shell: bash
        run: |
          cd ${{ matrix.which }}
          [ "${{ matrix.which }}" = "old" ] && cp ../new/tests/test_append_writers.py tests/ || true
          if [ "${{ matrix.which }}" = "old" ]; then
            python - <<'PY'
          import re
          p = "tests/test_append_writers.py"; s = open(p).read()
          s = s.replace('assert b"\\r" not in raw, "a CRLF was written"', 'raw = raw.replace(b"\\r\\n", b"\\n")')
          s = s.replace("assert sorted(got) == sorted((i, j) for i in range(N) for j in range(K))", 'assert len(got) == N * K, f"LOST {N*K-len(got)} of {N*K} records"')
          s = s.replace("assert sorted(got) == sorted((i, j) for i in range(P) for j in range(PK))", 'assert len(got) == P * PK, f"LOST {P*PK-len(got)} of {P*PK} records"')
          open(p, "w").write(s)
          PY
          fi
          : > /tmp/fails.txt
          for i in $(seq 1 15); do
            PYTHONPATH=. python -m pytest -q -p no:cacheprovider tests/test_append_writers.py -k "(threads or processes or episode or discovery) and not helper" -rf --tb=no 2>&1 | grep "^FAILED" >> /tmp/fails.txt || true
          done
          echo "ITERATIONS: 15 iterations x 14 concurrency tests (${{ matrix.which }} writers, ${{ matrix.load }})"
          echo "TOTAL FAILURES: $(wc -l < /tmp/fails.txt)"
          sed -E 's/ - .*//' /tmp/fails.txt | sort | uniq -c | sort -rn
          echo "--- sample messages"; sort -u /tmp/fails.txt | head -8 | cut -c1-220
